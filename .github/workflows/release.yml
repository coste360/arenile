name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/coste360/arenile
  NODE_VERSION: "22"
  GOTOOLCHAIN: local

jobs:
  image:
    name: Multi-arch image (amd64, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Arenile
            org.opencontainers.image.description=Gestionale gratuito per stabilimenti balneari (codice sorgente disponibile, BSL 1.1): prenotazioni online senza commissioni
            org.opencontainers.image.vendor=Coste360 SRL
            org.opencontainers.image.licenses=BUSL-1.1

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-dist:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            web/admin/dist
            web/booking/dist
          retention-days: 1
          if-no-files-found: error

  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web

      - name: Embed frontend
        run: |
          for app in admin booking; do
            dest="internal/http/static/$app"
            mkdir -p "$dest"
            find "$dest" -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
            cp -R "web/$app/dist/." "$dest/"
          done

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="arenile_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/arenile$ext" ./cmd/arenile
          for f in LICENSE README.md CHANGELOG.md; do [ -f "$f" ] && cp "$f" "dist/$name/"; done
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  portal-bundle:
    # Ready-made binaries are distributed through the Coste360 download portal (login required),
    # never as GitHub release assets: GitHub carries the source and the instructions only.
    # The repository is public, so the bundle is never stored as an Actions artifact (anyone
    # signed in could download it): it goes to the portal only when the upload is configured.
    # Desktop packages are built and signed in the private build repository.
    name: Portal bundle
    needs: [binaries]
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
    env:
      # Optional: the intake endpoint of the Coste360 portal. Without it the bundle is
      # built and checksummed, then discarded.
      PORTAL_UPLOAD_URL: ${{ secrets.PORTAL_UPLOAD_URL }}
      PORTAL_UPLOAD_TOKEN: ${{ secrets.PORTAL_UPLOAD_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Upload to the Coste360 portal
        if: env.PORTAL_UPLOAD_URL != '' && env.PORTAL_UPLOAD_TOKEN != ''
        working-directory: dist
        run: |
          for f in *; do
            curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $PORTAL_UPLOAD_TOKEN" \
              -F "version=${GITHUB_REF_NAME}" -F "file=@$f" "$PORTAL_UPLOAD_URL" >/dev/null
            echo "uploaded $f"
          done

      # The intermediate bin-* artifacts are public in a public repository: remove them as
      # soon as the bundle no longer needs them.
      - name: Remove intermediate binaries
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("bin-") or . == "web-dist") | .id' |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"; done

  docs:
    # Documentation of this release: screenshots regenerated on the real binary,
    # site built as an artifact (Pages deploy only if vars.DOCS_PAGES is "true").
    # Documentation only: no binaries are uploaded here.
    name: Documentation site
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ github.ref_name }}
      screenshots: true
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    name: GitHub release (notes and API contract, no binaries)
    needs: [image, portal-bundle]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.portal-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          files: api/openapi.yaml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
