name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/coste360/arenile
  NODE_VERSION: "22"
  GOTOOLCHAIN: local

jobs:
  image:
    name: Multi-arch image (amd64, arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Arenile
            org.opencontainers.image.description=Gestionale gratuito per stabilimenti balneari (codice sorgente disponibile, BSL 1.1): prenotazioni online senza commissioni
            org.opencontainers.image.vendor=Coste360 SRL
            org.opencontainers.image.licenses=BUSL-1.1

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-dist:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm --prefix web ci
      - run: npm --prefix web run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: |
            web/admin/dist
            web/booking/dist
          retention-days: 1
          if-no-files-found: error

  binaries:
    name: Binary ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: web-dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web

      - name: Embed frontend
        run: |
          for app in admin booking; do
            dest="internal/http/static/$app"
            mkdir -p "$dest"
            find "$dest" -mindepth 1 ! -name .gitkeep -exec rm -rf {} +
            cp -R "web/$app/dist/." "$dest/"
          done

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="arenile_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$name/arenile$ext" ./cmd/arenile
          for f in LICENSE README.md CHANGELOG.md; do [ -f "$f" ] && cp "$f" "dist/$name/"; done
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1
          if-no-files-found: error

  desktop:
    # Desktop edition packages (spec 29.1), built on native runners and signed when the
    # signing secrets exist (see docs/desktop-build.md). They only feed portal-bundle.
    name: Desktop packages
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  portal-bundle:
    # Ready-made binaries are distributed through the Coste360 download portal (login required),
    # never as GitHub release assets: GitHub carries the source and the instructions only.
    # The server bundle does not depend on the desktop packages: a notarization timeout, a
    # choco outage or an apt failure must not block the server release. When the desktop job
    # failed, the bundle ships without its packages and says so in the job summary; the
    # desktop workflow can then be re-run by hand (workflow_dispatch with the same tag).
    name: Portal bundle
    needs: [binaries, desktop]
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional: the intake endpoint of the Coste360 portal. When both secrets exist the
      # bundle is pushed there and the GitHub artifact is only a short-lived fallback.
      PORTAL_UPLOAD_URL: ${{ secrets.PORTAL_UPLOAD_URL }}
      PORTAL_UPLOAD_TOKEN: ${{ secrets.PORTAL_UPLOAD_TOKEN }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      # Taken also when one desktop job failed (e.g. only Windows arm64): the packages
      # that were built still reach the bundle, with the warning below.
      - name: Desktop packages (Windows x64/arm64 installers, macOS universal/arm64/x86_64 dmg, Linux AppImage)
        if: needs.desktop.result == 'success' || needs.desktop.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-{windows-amd64,windows-arm64,macos,macos-arm64,macos-x86_64,linux}
          path: dist
          merge-multiple: true

      - name: Note missing desktop packages
        if: needs.desktop.result != 'success'
        run: |
          echo "::warning::desktop packages missing or incomplete (desktop job: ${{ needs.desktop.result }}); check the bundle contents"
          echo "Desktop packages missing or incomplete: desktop job ended with **${{ needs.desktop.result }}**. Re-run desktop.yml with version ${{ github.ref_name }}." >> "$GITHUB_STEP_SUMMARY"

      # A macOS dmg whose notarization was still pending at Apple is kept in the desktop
      # artifact for a manual staple (docs/desktop-build.md) but never reaches the portal.
      - name: Drop packages with notarization pending
        working-directory: dist
        run: |
          shopt -s nullglob
          pending=(*-notarization-pending* *.notarization.txt)
          [ "${#pending[@]}" -eq 0 ] && exit 0
          printf 'dropped: %s\n' "${pending[@]}"
          rm -f -- "${pending[@]}"
          echo "::warning::macOS packages with notarization pending left out of the bundle; staple them and re-run desktop.yml"
          echo "macOS packages with notarization pending left out of the bundle: ${pending[*]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Upload to the Coste360 portal
        if: env.PORTAL_UPLOAD_URL != '' && env.PORTAL_UPLOAD_TOKEN != ''
        working-directory: dist
        run: |
          for f in *; do
            curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $PORTAL_UPLOAD_TOKEN" \
              -F "version=${GITHUB_REF_NAME}" -F "file=@$f" "$PORTAL_UPLOAD_URL" >/dev/null
            echo "uploaded $f"
          done

      # Short retention: the artifact is the hand-off to the portal (or a fallback when the
      # portal upload is not configured), not a download channel.
      - uses: actions/upload-artifact@v7
        with:
          name: portal-bundle-${{ github.ref_name }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  docs:
    # Documentation of this release: screenshots regenerated on the real binary,
    # site built as an artifact (Pages deploy only if vars.DOCS_PAGES is "true").
    # Documentation only: no binaries are uploaded here.
    name: Documentation site
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ github.ref_name }}
      screenshots: true
    permissions:
      contents: read
      pages: write
      id-token: write

  release:
    name: GitHub release (notes and API contract, no binaries)
    needs: [image, portal-bundle]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.portal-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: softprops/action-gh-release@v3
        with:
          files: api/openapi.yaml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
