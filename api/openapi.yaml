          format: uuid
          x-go-type: string
        rules:
          $ref: "#/components/schemas/PolicyRules"
    BookingDetail:
      type: object
      required: [id, code, status, channel, customer, starts_on, ends_on, slots, formula, is_season_pass, total_amount, paid_amount, balance_due, deposit_due, lines, extras, allocations, payments, history, price_snapshot, policy_snapshot, notes_customer, notes_internal, next_statuses, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        code:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        channel:
          $ref: "#/components/schemas/Channel"
        customer:
          $ref: "#/components/schemas/Customer"
        starts_on:
          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        is_season_pass:
          type: boolean
        test:
          type: boolean
          description: "Creata in modalità prova (spec 15.4): esclusa da report, KPI, corrispettivi ed esportazioni."
        season_id:
          type: string
          format: uuid
          x-go-type: string
        total_amount:
          $ref: "#/components/schemas/Money"
        paid_amount:
          $ref: "#/components/schemas/Money"
        balance_due:
          $ref: "#/components/schemas/Money"
        deposit_due:
          $ref: "#/components/schemas/Money"
        hold_expires_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/BookingLine"
        extras:
          type: array
          description: Extra legati alla prenotazione (attach_to = booking).
          items:
            $ref: "#/components/schemas/BookingExtra"
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/BookingAllocation"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        history:
          type: array
          items:
            $ref: "#/components/schemas/BookingHistoryEntry"
        price_snapshot:
          $ref: "#/components/schemas/PriceBreakdown"
        price_current:
          allOf:
            - $ref: "#/components/schemas/PriceBreakdown"
          description: >-
            Scomposizione corrente del prezzo dopo una modifica successiva alla conferma (ADR 0011):
            `total_amount` coincide con il suo totale. Assente finché la prenotazione non è stata modificata
            dopo la conferma (vale `price_snapshot`, immutabile, INV-21).
        policy_snapshot:
          $ref: "#/components/schemas/PolicySnapshot"
        promo_code:
          type: string
        agreement_id:
          type: string
          format: uuid
          x-go-type: string
        notes_customer:
          type: string
        notes_internal:
          type: string
        cancelled_at:
          type: string
          format: date-time
        cancel_reason:
          type: string
        created_by_user_id:
          type: string
          format: uuid
          x-go-type: string
        refunds:
          type: array
          description: "Rimborsi garantiti verso il provider (stato visibile, mai persi né doppi)."
          items:
            $ref: "#/components/schemas/RefundRequest"
        next_statuses:
          type: array
          description: Stati raggiungibili da quello corrente (macchina a stati, spec 10.2).
          items:
            $ref: "#/components/schemas/BookingStatus"
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BookingLineInput:
      type: object
      required: [pack_id]
      properties:
        pack_id:
          type: string
          format: uuid
          x-go-type: string
        zone_id:
          type: string
          format: uuid
          x-go-type: string
          description: Obbligatoria per zone in modalità zone o quantity; dedotta dalla postazione in modalità seat.
        spot_id:
          type: string
          format: uuid
          x-go-type: string
          description: Obbligatoria per le zone seat; facoltativa per le zone zone (assegnazione immediata).
        quantity:
          type: integer
          minimum: 1
          maximum: 100
          description: "Default 1; >1 solo per zone quantity."
        extras:
          type: array
          items:
            $ref: "#/components/schemas/SimulateExtra"
    BookingCreate:
      type: object
      description: >-
        Prenotazione dal pannello. Il cliente è customer_id oppure customer (creato nella stessa transazione).
        status: draft (nessuna risorsa), held (hold con scadenza, M4 lo userà per il checkout), confirmed (default:
        conferma manuale immediata, incasso alla cassa).
      required: [starts_on, ends_on, slots, formula, lines]
      properties:
        customer_id:
          type: string
          format: uuid
          x-go-type: string
        customer:
          $ref: "#/components/schemas/CustomerInput"
        channel:
          $ref: "#/components/schemas/Channel"
        starts_on:
          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/BookingLineInput"
        extras:
          type: array
          description: Extra legati alla prenotazione.
          items:
            $ref: "#/components/schemas/SimulateExtra"
        promo_code:
          type: string
          maxLength: 40
        agreement_id:
          type: string
          format: uuid
          x-go-type: string
        notes_customer:
          type: string
          maxLength: 2000
        notes_internal:
          type: string
          maxLength: 2000
        hold_id:
          type: string
          format: uuid
          x-go-type: string
          description: Converte questo hold (stessa selezione) invece di allocare di nuovo.
        status:
          type: string
          enum: [draft, held, confirmed]
          description: Stato iniziale (default confirmed).
        hold_ttl_seconds:
          type: integer
          minimum: 60
          maximum: 2592000
          description: Durata dell'hold per status=held (default ARENILE_HOLD_TTL).
        force:
          type: boolean
          description: Ignora le violazioni di policy (sempre permesso dal pannello, registrato nell'audit).
    BookingQuote:
      type: object
      required: [breakdown, deposit_due, policy, available, conflicts]
      properties:
        breakdown:
          $ref: "#/components/schemas/PriceBreakdown"
        deposit_due:
          $ref: "#/components/schemas/Money"
        policy:
          $ref: "#/components/schemas/PolicyEvaluation"
        available:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AllocationConflict"
    BookingPatch:
      type: object
      description: Campi da modificare; i campi assenti restano invariati. lines sostituisce tutte le righe.
      properties:
        customer_id:
          type: string
          format: uuid
          x-go-type: string
        starts_on:
          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/BookingLineInput"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/SimulateExtra"
        notes_customer:
          type: string
          maxLength: 2000
        notes_internal:
          type: string
          maxLength: 2000
        force:
          type: boolean
          description: Ignora i limiti di modifica della policy (registrato nell'audit).
    BookingChangeResult:
      type: object
      required: [applied, booking, previous_total, new_total, price_difference, conflicts]
      properties:
        applied:
          type: boolean
          description: false con dry_run=true (nessuna scrittura).
        booking:
          $ref: "#/components/schemas/BookingDetail"
        previous_total:
          $ref: "#/components/schemas/Money"
        new_total:
          $ref: "#/components/schemas/Money"
        price_difference:
          $ref: "#/components/schemas/Money"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AllocationConflict"
    BookingActionRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
    BookingCancelRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
        settlement:
          type: string
          enum: [policy, refund, credit, none]
          description: "policy (default): come da policy_snapshot; refund/credit forzano la forma; none: nessun rimborso."
        refund_amount:
          $ref: "#/components/schemas/Money"
        refund_method:
          $ref: "#/components/schemas/PaymentMethod"
        weather:
          type: boolean
          description: Cancellazione per maltempo (weather_policy).
        dry_run:
          type: boolean
    RefundPreview:
      type: object
      required: [paid_amount, refund_percent, amount, as]
      properties:
        paid_amount:
          $ref: "#/components/schemas/Money"
        refund_percent:
          type: integer
          minimum: 0
          maximum: 100
        amount:
          $ref: "#/components/schemas/Money"
        as:
          type: string
          enum: [refund, credit, none]
        tier:
          $ref: "#/components/schemas/PolicyCancellationTier"
    BookingCancelResult:
      type: object
      required: [applied, booking, refund]
      properties:
        applied:
          type: boolean
        booking:
          $ref: "#/components/schemas/BookingDetail"
        refund:
          $ref: "#/components/schemas/RefundPreview"
    BookingMoveRequest:
      type: object
      required: [line_id, spot_id]
      properties:
        line_id:
          type: string
          format: uuid
          x-go-type: string
        spot_id:
          type: string
          format: uuid
          x-go-type: string
        from:
          $ref: "#/components/schemas/Date"
        dry_run:
          type: boolean
    BookingNoteInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        visibility:
          type: string
          enum: [internal, customer]
    AutoAssignRequest:
      type: object
      required: [from, to]
      properties:
        from:
          $ref: "#/components/schemas/Date"
        to:
          $ref: "#/components/schemas/Date"
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        dry_run:
          type: boolean
    AutoAssignment:
      type: object
      required: [booking_id, line_id, spot_id]
      properties:
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        line_id:
          type: string
          format: uuid
          x-go-type: string
        spot_id:
          type: string
          format: uuid
          x-go-type: string
        spot_label:
          type: string
    AutoUnassigned:
      type: object
      required: [booking_id, line_id, reason]
      properties:
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        line_id:
          type: string
          format: uuid
          x-go-type: string
        reason:
          type: string
    AutoAssignResult:
      type: object
      required: [applied, assigned, unassigned]
      properties:
        applied:
          type: boolean
        assigned:
          type: array
          items:
            $ref: "#/components/schemas/AutoAssignment"
        unassigned:
          type: array
          items:
            $ref: "#/components/schemas/AutoUnassigned"

    # ---- Daily sale, tickets and entry tickets (migration 00010) ----
    TicketKind:
      type: string
      enum: [sale, entry]
      description: "sale = vendita giornaliera di una postazione; entry = biglietto d'ingresso."
    TicketStatus:
      type: string
      enum: [valid, voided]
      description: Stato memorizzato; un biglietto annullato mantiene il suo numero.
    TicketState:
      type: string
      enum: [assigned, unassigned, issued, entered, voided]
      description: >-
        Stato mostrato (derivato): assigned = vendita su una postazione; unassigned = zone-first da assegnare;
        issued = ingresso non ancora entrato; entered = ingresso registrato al varco; voided = annullato.
    TicketPaymentMethod:
      type: string
      enum: [cash, card]
      description: Metodo della vendita rapida (driver manuale; i contanti richiedono una sessione di cassa aperta).
    TicketPrintFormat:
      type: string
      enum: [thermal_80, thermal_58, a4, a5]
      description: Scontrino termico 80 o 58 mm, oppure foglio A4 o A5.
    DailySaleHolder:
      type: object
      description: Dati facoltativi del cliente, solo per l'etichetta in mappa (nessun telefono né email).
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
    DailySalePayment:
      type: object
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/TicketPaymentMethod"
        cash_session_id:
          type: string
          format: uuid
          x-go-type: string
          description: Default la sessione aperta della cassa (obbligatoria per i contanti, 409 cash_session_closed).
        tendered_amount:
          type: integer
          format: int64
          minimum: 0
          description: Contanti ricevuti in centesimi, per calcolare il resto (solo cash).
    DailySaleQuoteRequest:
      type: object
      description: >-
        Dove: spot_id (spot-first, postazione precisa) oppure zone_id (zone-first, es. "Prima fila"); esattamente
        uno dei due. Formula dalla fascia: FULL = giornata intera, AM = mattina, PM = pomeriggio.
      required: [date, slots, pack_id]
      properties:
        date:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        spot_id:
          type: string
          format: uuid
          x-go-type: string
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        pack_id:
          type: string
          format: uuid
          x-go-type: string
        extras:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/SimulateExtra"
    DailySaleQuote:
      type: object
      required: [breakdown, total, available, conflicts]
      properties:
        breakdown:
          $ref: "#/components/schemas/PriceBreakdown"
        total:
          $ref: "#/components/schemas/Money"
        available:
          type: boolean
          description: La postazione è libera o la zona ha ancora posti per la fascia.
        zone_free:
          type: integer
          minimum: 0
          description: Posti residui della zona (solo zone-first).
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AllocationConflict"
    DailySaleCreate:
      type: object
      description: Come DailySaleQuoteRequest, più pagamento e nome facoltativo.
      required: [date, slots, pack_id, payment]
      properties:
        date:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        spot_id:
          type: string
          format: uuid
          x-go-type: string
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        pack_id:
          type: string
          format: uuid
          x-go-type: string
        extras:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/SimulateExtra"
        payment:
          $ref: "#/components/schemas/DailySalePayment"
        holder:
          $ref: "#/components/schemas/DailySaleHolder"
        expected_total:
          $ref: "#/components/schemas/Money"
        notes_internal:
          type: string
          maxLength: 2000
    DailySaleResult:
      type: object
      required: [ticket, booking_id, payment_id]
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        payment_id:
          type: string
          format: uuid
          x-go-type: string
        change_amount:
          $ref: "#/components/schemas/Money"
    TicketExtra:
      type: object
      required: [extra_id, name, quantity, total]
      properties:
        extra_id:
          type: string
          format: uuid
          x-go-type: string
        name:
          $ref: "#/components/schemas/I18nText"
        quantity:
          type: integer
          minimum: 1
        total:
          $ref: "#/components/schemas/Money"
    TicketEntryItem:
      type: object
      required: [entry_ticket_type_id, name, quantity, total]
      properties:
        entry_ticket_type_id:
          type: string
          format: uuid
          x-go-type: string
        name:
          $ref: "#/components/schemas/I18nText"
        quantity:
          type: integer
          minimum: 1
        total:
          $ref: "#/components/schemas/Money"
    Ticket:
      type: object
      required: [id, kind, status, state, ticket_date, ticket_number, number_label, booking_id, booking_code, zone_id, zone_name,
        needs_assignment, slots, formula, extras, entry_items, total_amount, vat, payment_method, print_count, version, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        kind:
          $ref: "#/components/schemas/TicketKind"
        status:
          $ref: "#/components/schemas/TicketStatus"
        state:
          $ref: "#/components/schemas/TicketState"
        ticket_date:
          $ref: "#/components/schemas/Date"
        ticket_number:
          type: integer
          format: int64
          minimum: 1
          description: Progressivo del giorno (riparte da 1 ogni giorno, unico per stabilimento).
        number_label:
          type: string
          description: Numero formattato a tre cifre con cancelletto (es. "#037"), usato in mappa e in stampa.
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        booking_code:
          type: string
          description: Codice della prenotazione, stampato in chiaro sotto il QR (il QR porta il gate token).
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        zone_name:
          $ref: "#/components/schemas/I18nText"
        spot_id:
          type: string
          format: uuid
          x-go-type: string
          description: Postazione assegnata (assente se da assegnare o per gli ingressi).
        spot_label:
          type: string
        needs_assignment:
          type: boolean
          description: Vendita zone-first non ancora collocata ("da assegnare").
        holder_name:
          type: string
          description: Nome facoltativo per l'etichetta in mappa.
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        pack_id:
          type: string
          format: uuid
          x-go-type: string
        pack_name:
          $ref: "#/components/schemas/I18nText"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/TicketExtra"
        entry_items:
          type: array
          description: Righe per tipo di ingresso (solo kind=entry).
          items:
            $ref: "#/components/schemas/TicketEntryItem"
        total_amount:
          $ref: "#/components/schemas/Money"
        vat:
          type: array
          items:
            $ref: "#/components/schemas/VatBreakdown"
        payment_method:
          $ref: "#/components/schemas/TicketPaymentMethod"
        payment_id:
          type: string
          format: uuid
          x-go-type: string
        cash_session_id:
          type: string
          format: uuid
          x-go-type: string
        print_count:
          type: integer
          minimum: 0
        created_by_user_id:
          type: string
          format: uuid
          x-go-type: string
        voided_at:
          type: string
          format: date-time
        void_reason:
          type: string
        refund_payment_id:
          type: string
          format: uuid
          x-go-type: string
        entered_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
    TicketMethodTotal:
      type: object
      required: [method, count, amount]
      properties:
        method:
          $ref: "#/components/schemas/TicketPaymentMethod"
        count:
          type: integer
          minimum: 0
        amount:
          $ref: "#/components/schemas/Money"
    TicketDaySummary:
      type: object
      description: >-
        Riepilogo dei biglietti per giorno di validità (ticket_date), non per data di incasso: una vendita anticipata
        compare nel giorno di utilizzo, gli annullati sono contati ma non sommati. Non è una riconciliazione di cassa:
        incassi, rimborsi e corrispettivi seguono la data contabile dei pagamenti (sessione di cassa, corrispettivi).
      required: [issued, voided, unassigned, entered, total_amount, by_method, vat]
      properties:
        issued:
          type: integer
          minimum: 0
        voided:
          type: integer
          minimum: 0
        unassigned:
          type: integer
          minimum: 0
        entered:
          type: integer
          minimum: 0
        total_amount:
          $ref: "#/components/schemas/Money"
        by_method:
          type: array
          items:
            $ref: "#/components/schemas/TicketMethodTotal"
        vat:
          type: array
          items:
            $ref: "#/components/schemas/VatBreakdown"
