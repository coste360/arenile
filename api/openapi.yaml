  # ---- M5 part B: season rollover, renewals, waitlist, customer credits ----
  /api/admin/v1/establishments/{establishmentId}/seasons/{seasonId}/rollover:
    post:
      operationId: rolloverSeason
      tags: [seasons]
      summary: "Fine stagione: crea la stagione successiva copiando la configurazione (anteprima e applicazione)"
      description: >-
        Spec 8.7, 10.4, 28 (M5). `dry_run = true` (default) restituisce l'anteprima senza scrivere. L'applicazione
        crea in una transazione la stagione dell'anno indicato copiando periodi tariffari, chiusure (spostate
        sull'anno), regole di prezzo, prezzi fissi e policy; catalogo e mappe non dipendono dalla stagione e restano
        invariati. Idempotente: un secondo `apply` con lo stesso anno restituisce 200 con il risultato già registrato
        (`already_applied = true`); 409 `season_rollover_conflict` se esiste già una stagione di quell'anno non
        creata da questo passaggio. Permesso establishment.configure.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/SeasonID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonRolloverRequest"
      responses:
        "200":
          description: "Anteprima o passaggio già applicato"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonRolloverResult"
        "201":
          description: "Passaggio applicato"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonRolloverResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
