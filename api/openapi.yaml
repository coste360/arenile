        - assignment_mode
        - price_category
      properties:
        code:
          type: string
        name:
          $ref: "#/components/schemas/I18nText"
        assignment_mode:
          $ref: "#/components/schemas/AssignmentMode"
        price_category:
          type: string
    SetupTemplatePack:
      type: object
      required:
        - code
        - name
        - composition
      properties:
        code:
          type: string
        name:
          $ref: "#/components/schemas/I18nText"
        composition:
          $ref: "#/components/schemas/ComponentQuantities"
    SetupTemplate:
      type: object
      required:
        - code
        - name
        - description
        - rows
