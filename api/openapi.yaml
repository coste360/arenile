      properties:
        terms:
          type: string
          maxLength: 50000
        privacy:
          type: string
          maxLength: 50000
        marketing:
          type: string
          maxLength: 2000
          description: Testo del consenso marketing facoltativo.
    PublicTerms:
      type: object
      description: Versione corrente delle condizioni da accettare nel checkout.
      required: [version, texts]
      properties:
        version:
          type: string
        texts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TermsTexts"
    PublicZone:
      type: object
      required: [id, code, name, assignment_mode, sort_order]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        code:
          type: string
        name:
          $ref: "#/components/schemas/I18nText"
        assignment_mode:
          $ref: "#/components/schemas/AssignmentMode"
        map_id:
          type: string
          format: uuid
          x-go-type: string
        sort_order:
          type: integer
    PublicMapRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          $ref: "#/components/schemas/I18nText"
    PublicPaymentConfig:
      type: object
      required: [provider, online, embedded, test_mode]
      properties:
        provider:
          type: string
          description: Codice del provider attivo (`manual` se nessun provider online è configurato).
        online:
          type: boolean
          description: Vero se il cliente può pagare online.
        embedded:
          type: boolean
          description: Payment Element incorporato abilitato (altrimenti Checkout in redirect).
        publishable_key:
          type: string
          description: Chiave pubblicabile, solo con `embedded`.
        test_mode:
          type: boolean
        live_payments_blocked:
          type: boolean
          description: >-
            Vero quando il provider attivo è configurato in modalità test (chiavi di prova) e la modalità
            prova dello stabilimento è spenta: i pagamenti online dei clienti reali sono bloccati (INV-88),
            `online` è falso e il pagamento risponde 409 `payment_provider_test_mode`.
    PublicOnlineConfig:
      type: object
      description: Configurazione del flusso pubblico (spec 12, 17.2).
      required: [zones, maps, formulas, slots, hold_minutes, payment, show_prices_on_map, show_rate_periods, promo_codes_enabled, require_phone]
      properties:
        zones:
          type: array
          description: Zone visibili online, in ordine.
          items:
            $ref: "#/components/schemas/PublicZone"
        maps:
          type: array
          items:
            $ref: "#/components/schemas/PublicMapRef"
        formulas:
          type: array
          items:
            $ref: "#/components/schemas/Formula"
        slots:
          type: array
          description: Fasce prenotabili online.
          items:
            $ref: "#/components/schemas/Slots"
        min_date:
          $ref: "#/components/schemas/Date"
        max_date:
          $ref: "#/components/schemas/Date"
        hold_minutes:
          type: integer
          description: Durata del blocco provvisorio (countdown).
        payment:
          $ref: "#/components/schemas/PublicPaymentConfig"
        show_prices_on_map:
          type: boolean
        show_rate_periods:
          type: boolean
        promo_codes_enabled:
          type: boolean
        require_phone:
          type: boolean
          deprecated: true
          description: >-
            Sempre false: il telefono è facoltativo ovunque (decisione del gestore, ADR 0020). Il campo resta per
            compatibilità con i client esistenti.
        terms:
          $ref: "#/components/schemas/PublicTerms"
