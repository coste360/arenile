          type: string
    EmailReminderSchedule:
      type: object
      description: >-
        Orari dei promemoria automatici nel fuso dello stabilimento (ADR 0022). Il promemoria del giorno prima
        parte il giorno precedente l'inizio alle `day_before_time`; quello del saldo alle `balance_time`,
        `balance_lead_days` giorni prima della scadenza del saldo indicata dalla policy (`balance_due`:
        `days_before:N` o, se all'arrivo, il giorno di inizio).
      required: [day_before_time, balance_time, balance_lead_days]
      properties:
        day_before_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "18:00"
        balance_time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          example: "10:00"
        balance_lead_days:
          type: integer
          minimum: 0
          maximum: 30
