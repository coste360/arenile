        fasce, condizioni correnti, pagamento). Risposta con `ETag` (hash del contenuto) e
        `Cache-Control: public, max-age=30`; `If-None-Match` risponde 304.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
