        align:
          $ref: "#/components/schemas/ComparisonAlign"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonMetric"
        series:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonPoint"

    # ---- M5A: API keys -------------------------------------------------------------
    ApiKeyStatus:
      type: string
      enum: [active, expired, revoked]
    ApiKey:
      type: object
      required: [id, name, prefix, establishment_id, scopes, status, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
        prefix:
          type: string
          description: "Parte visibile della chiave, per riconoscerla (`ar_live_abcd2345`)."
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        status:
          $ref: "#/components/schemas/ApiKeyStatus"
        created_by_user_id:
          type: string
          format: uuid
          x-go-type: string
        created_by_name:
          type: string
          description: Nome dell'utente che l'ha creata (vuoto se l'utente non esiste più).
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    ApiKeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    ApiKeyCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Permission"
        expires_at:
          type: string
          format: date-time
          description: Scadenza facoltativa, nel futuro.
    ApiKeyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Permission"
        expires_at:
          type: string
          format: date-time
          description: Nuova scadenza, nel futuro.
        clear_expiry:
          type: boolean
          description: true rimuove la scadenza (incompatibile con expires_at).
    ApiKeyCreated:
      type: object
      required: [api_key, secret]
      properties:
        api_key:
          $ref: "#/components/schemas/ApiKey"
        secret:
          type: string
          description: "Chiave completa `ar_live_<prefix>_<secret>`, mostrata solo ora."

    # ---- M5A: outgoing webhooks ----------------------------------------------------------
    WebhookEventType:
      type: string
      description: "Tipi di evento sottoscrivibili (spec 18.1) più `webhook.test`, inviato solo dal test."
      enum:
        - booking.created
        - booking.held
        - booking.confirmed
        - booking.modified
        - booking.cancelled
        - booking.checked_in
        - booking.no_show
        - booking.completed
        - booking.approval_requested
        - allocation.released
        - season.day_released
        - season.renewal_offered
        - season.renewal_accepted
        - season.renewal_declined
        - season.renewal_expired
        - season.rolled_over
        - waitlist.joined
        - waitlist.offered
        - waitlist.offer_expired
        - waitlist.converted
        - credit.issued
        - credit.consumed
        - credit.expired
        - payment.succeeded
        - payment.failed
        - payment.refunded
        - customer.created
        - customer.anonymized
        - cash_session.closed
        - config.pricing_changed
        - config.map_changed
        - webhook.test
    WebhookEventFilter:
      type: string
      description: "Un WebhookEventType, un gruppo `<prefisso>.*` (es. `booking.*`) o `*` (tutti)."
      pattern: "^(\\*|[a-z][a-z0-9_]*\\.(\\*|[a-z][a-z0-9_]*))$"
      maxLength: 64
    WebhookEndpointStatus:
      type: string
      description: "active; paused (disattivato dal gestore); disabled (disattivato automaticamente dopo errori ripetuti)."
      enum: [active, paused, disabled]
    WebhookEndpoint:
      type: object
      required: [id, url, description, events, active, status, consecutive_failures, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        url:
          type: string
        description:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventFilter"
        active:
          type: boolean
        status:
          $ref: "#/components/schemas/WebhookEndpointStatus"
        consecutive_failures:
          type: integer
        disabled_at:
          type: string
          format: date-time
        disabled_reason:
          type: string
        previous_secret_expires_at:
          type: string
          format: date-time
          description: Fine del periodo di grazia del segreto precedente, se in corso.
        last_delivery_at:
          type: string
          format: date-time
          description: Ultimo tentativo di consegna (qualsiasi esito).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookEndpointList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEndpoint"
    WebhookEndpointCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
        description:
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/WebhookEventFilter"
        active:
          type: boolean
          default: true
    WebhookEndpointUpdate:
      type: object
      properties:
        url:
          type: string
          minLength: 8
          maxLength: 2048
        description:
          type: string
          maxLength: 200
        events:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/WebhookEventFilter"
        active:
          type: boolean
    WebhookEndpointCreated:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        secret:
          type: string
          description: "Segreto di firma `whsec_…`, mostrato solo ora."
    WebhookSecretRotate:
      type: object
      properties:
        grace_hours:
          type: integer
          minimum: 0
          maximum: 168
          default: 24
          description: Ore in cui anche il segreto precedente firma le consegne.
    WebhookSecretRotated:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          $ref: "#/components/schemas/WebhookEndpoint"
        secret:
          type: string
          description: "Nuovo segreto `whsec_…`, mostrato solo ora."
    WebhookDeliveryStatus:
      type: string
      description: "pending (in coda o in attesa di ripetizione), delivered (2xx), failed (definitivamente)."
      enum: [pending, delivered, failed]
    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event_id, event_type, status, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        endpoint_id:
          type: string
          format: uuid
          x-go-type: string
        event_id:
          type: string
          description: "Id dell'evento nell'envelope (`evt_<uuid>`), uguale all'header Arenile-Event-Id."
        event_type:
          type: string
        status:
          $ref: "#/components/schemas/WebhookDeliveryStatus"
        attempts:
          type: integer
        status_code:
          type: integer
          description: Codice HTTP dell'ultimo tentativo (assente se nessuna risposta).
        last_error:
          type: string
        next_attempt_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        failed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [request_body]
          properties:
            request_body:
              type: object
              additionalProperties: true
              description: Envelope JSON inviato (spec 18.1), uguale per ogni tentativo.
            response_excerpt:
              type: string
              description: Primi 1024 byte della risposta dell'ultimo tentativo.
    WebhookDeliveryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WebhookDelivery"
        next_cursor:
          type: string

    # ---- M5A: map sea side ----------------------------------------------------------
    MapTransform:
      type: string
      description: >-
        Trasformazione applicata: none (stesso lato), mirror_y (top↔bottom), mirror_x (left↔right),
        rotate_cw / rotate_ccw (lati adiacenti, 90°, width e height scambiati).
      enum: [none, mirror_y, mirror_x, rotate_cw, rotate_ccw]
    MapReorientRequest:
      type: object
      required: [sea_side]
      properties:
        sea_side:
          $ref: "#/components/schemas/SeaSide"
        dry_run:
          type: boolean
          default: false
          description: Calcola l'anteprima senza salvare.
        acknowledge_future_allocations:
          type: boolean
          default: false
          description: Conferma esplicita quando ci sono allocazioni future (solo la geometria cambia).
    MapReorientResult:
      type: object
      required: [document, from_sea_side, to_sea_side, transform, applied, future_allocations, spots_with_future_allocations]
      properties:
        document:
          $ref: "#/components/schemas/MapDocument"
        from_sea_side:
          $ref: "#/components/schemas/SeaSide"
        to_sea_side:
          $ref: "#/components/schemas/SeaSide"
        transform:
          $ref: "#/components/schemas/MapTransform"
        applied:
          type: boolean
          description: false con dry_run (document è l'anteprima, versione invariata).
        future_allocations:
          type: integer
          description: Allocazioni (booking, season, block) da oggi in avanti sulle postazioni della mappa.
        spots_with_future_allocations:
          type: integer
    Meta:
      type: object
      description: >-
        Metadati pubblici dell'istanza (spec 29.2). I client confrontano `version` con la propria versione
        minima supportata e `min_client_versions` con la propria versione.
      required: [product, version, api_version, edition, server_time, min_client_versions, capabilities, features]
      properties:
        product:
          type: string
          enum: [arenile]
        version:
          type: string
          description: Versione del server (tag di release, `dev` in sviluppo).
        api_version:
          type: string
          description: Versione del contratto (`info.version` di api/openapi.yaml).
        edition:
          $ref: "#/components/schemas/Edition"
        desktop:
          $ref: "#/components/schemas/DesktopRuntime"
        server_time:
          type: string
          format: date-time
          description: Ora del server (UTC), per segnalare orologi dei dispositivi molto sfasati.
        min_client_versions:
          $ref: "#/components/schemas/MinClientVersions"
        capabilities:
          $ref: "#/components/schemas/MetaCapabilities"
        features:
          type: array
          description: >-
            Slug stabili delle funzioni attive su questa istanza (es. `bookings`, `cash`, `season_passes`,
            `public_page`, `online_payments`, `device_pairing`, `fiscal_bridge`, `desktop_backups`,
            `lan_mode`). I client ignorano gli slug sconosciuti.
          items:
            type: string
    Edition:
      type: string
      description: >-
        `server`: binario o immagine Docker (VPS, server in sede). `desktop`: server interno dell'app desktop
        sul PC della cassa (spec 29.1). La modalità remota dell'app desktop è un client: l'istanza a cui si
        collega riporta la propria edizione.
      enum: [server, desktop]
    DesktopRuntime:
      type: object
      description: Presente solo con `edition=desktop`.
      required: [mode]
      properties:
        mode:
          type: string
          description: >-
            `local`: server raggiungibile solo da 127.0.0.1. `lan`: anche dalla rete locale del lido, in TLS con
            certificato autogenerato.
          enum: [local, lan]
        lan_url:
          type: string
          format: uri
          description: Indirizzo sulla rete locale (solo `mode=lan`), es. `https://192.168.1.20:8443`.
        lan_cert_fingerprint:
          type: string
          description: SHA-256 del certificato TLS autogenerato, esadecimale maiuscolo separato da `:` (solo `mode=lan`).
        lan_qr_svg:
          type: string
          description: >-
            QR code (SVG) dell'indirizzo del pannello sulla rete locale (`lan_url` + `/admin/`), da inquadrare con la
            fotocamera di un telefono o tablet per aprirlo nel browser (solo `mode=lan`). Non contiene codici di
            abbinamento: per l'app si usa il QR di Configurazione → Dispositivi.
        lan_cert_renews_at:
          type: string
          format: date-time
          description: >-
            Istante in cui il certificato autogenerato verrà rigenerato (30 giorni prima della scadenza, solo
            `mode=lan`): da quel momento cambia l'impronta, i dispositivi abbinati vanno riabbinati e i browser devono
            riaccettare il certificato. Il pannello avvisa quando mancano meno di 60 giorni.
    MinClientVersions:
      type: object
      description: Versioni minime dei client che questa istanza supporta (semver).
      required: [mobile, desktop]
      properties:
        mobile:
          type: string
        desktop:
          type: string
    MetaCapabilities:
      type: object
      required:
        - online_booking
        - online_payments
        - payment_providers
        - fiscal_drivers
        - device_pairing
        - fiscal_bridge
        - realtime
        - push_notifications
      properties:
        online_booking:
          type: boolean
          description: Pagina pubblica e widget disponibili (falso nell'edizione desktop).
        online_payments:
          type: boolean
          description: Pagamenti online disponibili (falso nell'edizione desktop, solo driver `manual`).
        payment_providers:
          type: array
          items:
            type: string
        fiscal_drivers:
          type: array
          items:
            type: string
        device_pairing:
          type: boolean
          description: Abbinamento dei dispositivi possibile ora (falso nell'edizione desktop senza rete locale).
        fiscal_bridge:
          type: boolean
          description: L'istanza accetta un ponte fiscale da un'app desktop in modalità remota.
        realtime:
          type: boolean
          description: Flusso SSE `GET /api/admin/v1/stream` disponibile.
        push_notifications:
          type: boolean
          description: Notifiche push tramite relay configurate (M7).

    DevicePlatform:
      type: string
      enum: [ios, android, windows, macos, linux, other]
    DeviceKind:
      type: string
      description: "`mobile`: app mobile (M7). `desktop`: app desktop in modalità remota (M6)."
      enum: [mobile, desktop]
    DevicePairingCodeRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          x-go-type: string
          description: Utente a cui legare il dispositivo (default l'utente corrente; un altro utente richiede `users.manage`).
        kind:
          $ref: "#/components/schemas/DeviceKind"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 900
          default: 300
    DevicePairingCode:
      type: object
      required: [code, expires_at, establishment_id, user_id, qr_payload, qr_text]
      properties:
        code:
          type: string
          description: >-
            Codice da digitare in alternativa al QR: 8 caratteri base32 Crockford in due gruppi (`ABCD-EFGH`),
            confrontato senza distinguere maiuscole e trattini.
        expires_at:
          type: string
          format: date-time
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
        user_id:
          type: string
          format: uuid
          x-go-type: string
        qr_payload:
          $ref: "#/components/schemas/DevicePairingQRPayload"
        qr_text:
          type: string
          description: >-
            Testo da codificare nel QR: `arenile://pair?d=<qr_payload JSON in base64url>`. L'app lo decodifica;
            un browser che scansiona il QR apre `qr_payload.url`.
        qr_svg:
          type: string
          description: >-
            QR di `qr_text` in SVG in linea (correzione M, zona di rispetto inclusa, sfondo bianco), da mostrare
            nel pannello senza una seconda richiesta: il codice non è conservato in chiaro, quindi non esiste un
            endpoint che possa ridisegnarlo.
    DevicePairingQRPayload:
      type: object
      required: [v, url, code]
      properties:
        v:
          type: integer
          enum: [1]
          description: Versione del formato.
        url:
          type: string
          format: uri
          description: Indirizzo dell'istanza (base URL; nell'edizione desktop l'indirizzo sulla rete locale).
        code:
          type: string
        fingerprint:
          type: string
          description: >-
            SHA-256 del certificato TLS (solo con certificato autogenerato, modalità rete locale). L'app accetta
            il certificato solo se coincide (certificate pinning).
        establishment_name:
          type: string
    DevicePairRequest:
      type: object
      required: [code, name, platform, kind]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 16
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nome mostrato nel pannello (es. "iPhone di Anna", "PC cassa").
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        kind:
          $ref: "#/components/schemas/DeviceKind"
        app_version:
          type: string
          maxLength: 32
    DevicePairResult:
      type: object
      required: [token, device, establishment_id]
      properties:
        token:
          type: string
          description: Token per dispositivo, restituito solo ora. Conservarlo nel portachiavi sicuro del dispositivo.
        device:
          $ref: "#/components/schemas/Device"
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
    Device:
      type: object
      required: [id, establishment_id, user_id, user_name, role, name, platform, kind, created_at, current, fiscal_bridge]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
        user_id:
          type: string
          format: uuid
          x-go-type: string
        user_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        name:
          type: string
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        kind:
          $ref: "#/components/schemas/DeviceKind"
        app_version:
          type: string
        token_prefix:
          type: string
          description: Parte visibile del token (`ar_dev_<prefix>`), per riconoscerlo.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: Vero se la richiesta è autenticata con il token di questo dispositivo.
        fiscal_bridge:
          type: boolean
          description: Vero se il dispositivo è il ponte fiscale attivo dello stabilimento.
    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        next_cursor:
          type: string
          description: Presente se esistono altri elementi.
    CurrentDeviceInfo:
      type: object
      description: Dispositivo con cui è autenticata la richiesta (solo con token per dispositivo).
      required: [id, name, establishment_id]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
        establishment_id:
          type: string
          format: uuid
          x-go-type: string

    FiscalBridgeRegistration:
      type: object
      required: [driver]
      properties:
        driver:
          type: string
          minLength: 1
          maxLength: 64
          description: Codice del FiscalDriver locale dell'app desktop (es. `none`, o il driver del registratore).
        device_status:
          $ref: "#/components/schemas/FiscalDeviceStatus"
    FiscalDeviceStatus:
      type: object
      required: [online]
      properties:
        online:
          type: boolean
        message:
          type: string
          maxLength: 500
        checked_at:
          type: string
          format: date-time
    FiscalBridgeStatus:
      type: object
      required: [registered, online, pending_jobs, failed_jobs]
      properties:
        registered:
          type: boolean
        device_id:
          type: string
          format: uuid
          x-go-type: string
        device_name:
          type: string
        driver:
          type: string
        online:
          type: boolean
          description: Ultimo contatto entro 60 secondi.
        last_seen_at:
          type: string
          format: date-time
        device_status:
          $ref: "#/components/schemas/FiscalDeviceStatus"
        pending_jobs:
          type: integer
        failed_jobs:
          type: integer
    FiscalBridgeJobKind:
      type: string
      description: "`issue`: emetti il documento. `void`: annulla il documento `ref`."
      enum: [issue, void]
    FiscalBridgeJob:
      type: object
      required: [id, kind, attempt, lease_expires_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        kind:
          $ref: "#/components/schemas/FiscalBridgeJobKind"
        attempt:
          type: integer
          minimum: 1
        lease_expires_at:
          type: string
          format: date-time
        document:
          $ref: "#/components/schemas/FiscalBridgeDocument"
        ref:
          type: string
          description: Riferimento del documento da annullare (solo `void`).
    FiscalBridgeDocument:
      type: object
      description: Documento da emettere, specchio di `ext.FiscalDocumentRequest` (importi lordi in centesimi).
      required: [establishment_id, currency, lines, payments, total, issued_at, idempotency_key]
      properties:
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
        booking_id:
          type: string
        payment_id:
          type: string
        currency:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/FiscalBridgeLine"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/FiscalBridgePayment"
        total:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date-time
        idempotency_key:
          type: string
    FiscalBridgeLine:
      type: object
      required: [description, quantity, unit_gross, gross, vat_rate_bp]
      properties:
        description:
          type: string
        quantity:
          type: integer
          format: int64
        unit_gross:
          type: integer
          format: int64
        gross:
          type: integer
          format: int64
        vat_rate_bp:
          type: integer
          format: int64
          description: Aliquota IVA in punti base (2200 = 22%).
    FiscalBridgePayment:
      type: object
      required: [method, amount]
      properties:
        method:
          type: string
        amount:
          type: integer
          format: int64
    FiscalBridgeJobBatch:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/FiscalBridgeJob"
    FiscalBridgeJobResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [succeeded, failed]
        ref:
          type: string
          maxLength: 128
        number:
          type: string
          maxLength: 64
        issued_at:
          type: string
          format: date-time
        raw:
          type: object
          additionalProperties: true
          description: Risposta del driver locale, conservata per l'audit (max 16 KiB).
        error:
          type: string
          maxLength: 1000
        retryable:
          type: boolean
          description: "Errore temporaneo (registratore spento, carta finita): il lavoro torna in coda."

    FirstRunStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: Vero finché non esiste alcun utente.
    FirstRunRequest:
      type: object
      required: [setup_token, email, name, password, organization_name]
      properties:
        setup_token:
          type: string
          minLength: 32
          maxLength: 128
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 12
          maxLength: 256
        organization_name:
          type: string
          minLength: 1
          maxLength: 120
    SystemUpdate:
      type: object
      description: >-
        Stato dell'avviso di nuova versione (ADR 0025). `latest`, `published_at`, `release_notes_url` e
        `download_url` sono presenti solo dopo un controllo riuscito negli ultimi 7 giorni.
      required: [current, status, update_available, how_to_update, check_enabled, pending]
      properties:
        current:
          type: string
          description: Versione in esecuzione (tag di release, `dev` in sviluppo).
        status:
          type: string
          enum: [ok, unavailable, disabled]
          description: >-
            `ok`: l'ultimo controllo è riuscito (o il primo non è ancora avvenuto, vedi `pending`); `unavailable`: l'ultimo
            controllo non è riuscito (rete, risposta non valida, server non raggiungibile), mai un errore per
            l'utente: il pannello mostra solo una riga neutra e conserva l'ultimo risultato riuscito degli
            ultimi 7 giorni; `disabled`: controllo spento o versione di sviluppo (nessuna chiamata di rete).
        latest:
          type: string
          description: Ultima versione pubblicata.
        update_available:
          type: boolean
          description: Vero se `latest` è più recente di `current` e il controllo è attivo.
        published_at:
          type: string
          format: date-time
        release_notes_url:
          type: string
          format: uri
          description: Pagina con le novità della versione.
        download_url:
          type: string
          format: uri
          description: >-
            Edizione desktop: il pacchetto per il sistema operativo e l'architettura in uso, oppure la pagina
            dei download. Installazione con il binario: l'archivio per il sistema in uso. Assente con Docker.
        how_to_update:
          type: string
          enum: [desktop, docker, binary]
          description: Come si aggiorna questa installazione (sceglie l'azione proposta dal pannello).
        check_enabled:
          type: boolean
          description: Vero se il controllo degli aggiornamenti è attivo.
        checked_at:
          type: string
          format: date-time
          description: Ultimo controllo riuscito (UTC).
        pending:
          type: boolean
          description: >-
            Vero finché il primo controllo dopo l'avvio non è avvenuto (controllo attivo, versione di release): il
            pannello rilegge lo stato a breve invece di attendere il prossimo aggiornamento orario.
        last_attempt_at:
          type: string
          format: date-time
          description: Ultimo tentativo di controllo, riuscito o no (UTC).
        os:
          type: string
          description: Sistema operativo dell'installazione (`darwin`, `windows`, `linux`), per l'etichetta del download.
        arch:
          type: string
          description: Architettura dell'installazione (`amd64`, `arm64`), per l'etichetta del download.
    DesktopSettings:
      type: object
      required: [backup_dir, backup_retention, backup_daily, backup_on_exit, update_check, autostart, lan_enabled]
      properties:
        backup_dir:
          type: string
          minLength: 1
          maxLength: 1024
          description: Cartella dei backup (default `<cartella dati>/backups`).
        backup_retention:
          type: integer
          minimum: 1
          maximum: 365
          description: Numero di backup automatici conservati (i manuali non vengono eliminati).
        backup_daily:
          type: boolean
        backup_on_exit:
          type: boolean
        update_check:
          type: boolean
          description: >-
            Controllo della nuova versione (vero di default, ADR 0025): una richiesta al giorno al file pubblico
            della versione più recente, senza dati dello stabilimento né identificativi. Falso = nessuna chiamata
            di rete.
        autostart:
          type: boolean
          description: Avvio automatico all'accensione del PC.
        lan_enabled:
          type: boolean
          description: Modalità rete locale (TLS con certificato autogenerato).
        lan_port:
          type: integer
          minimum: 1024
          maximum: 65535
          description: Porta del listener sulla rete locale (default 8443).
        keep_running_in_tray:
          type: boolean
          description: >-
            Alla chiusura della finestra l'app resta attiva nella barra di sistema invece di chiudersi
            (Windows; default falso). Su macOS la finestra si nasconde sempre e l'app resta nella barra dei
            menu finché non si sceglie Esci. Se omesso nella richiesta resta il valore attuale.
    DesktopBackupReason:
      type: string
      enum: [manual, daily, exit, pre_restore]
    DesktopBackup:
      type: object
      required: [name, size_bytes, created_at, reason]
      properties:
        name:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        reason:
          $ref: "#/components/schemas/DesktopBackupReason"
    DesktopBackupList:
      type: object
      required: [directory, items]
      properties:
        directory:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DesktopBackup"
    DesktopRestoreScheduled:
      type: object
      required: [backup, restart_required]
      properties:
        backup:
          $ref: "#/components/schemas/DesktopBackup"
        restart_required:
          type: boolean
