      tags: [customers]
      summary: "Applica l'importazione validata"
      description: >-
        Tutto o niente: un'unica transazione (rollback completo al primo errore, stato failed con il
        rapporto). Idempotente: le righe già presenti (stesso criterio di corrispondenza) sono aggiornate o
        saltate, ripetere apply su un'importazione applied restituisce il risultato registrato; lo stesso
        file (SHA-256) già applicato → 409 import_already_applied. Gli abbonamenti passano dal servizio
        prenotazioni (allocazioni, audit, outbox). If-Match sulla versione dell'anteprima.
