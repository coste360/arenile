      type: object
      required:
        [period, occupancy_bp, occupied_units, capacity_units, revenue_collected, revenue_booked, bookings,
         average_booking_value, cancellations, no_shows, season_passes_sold, open_balance_total,
         open_balance_bookings, generated_at]
