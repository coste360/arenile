  /api/admin/v1/establishments/{establishmentId}/reports/comparison:
    get:
      operationId: getYearComparisonReport
      tags: [reports]
      summary: Confronto con l'anno precedente sullo stesso intervallo di calendario
      description: >-
        Confronta from..to con lo stesso intervallo di calendario dell'anno precedente (stesso giorno e
        mese; il 29 febbraio diventa 28 febbraio) o di `compare_year` (che deve precedere l'anno di from).
        Per ogni metrica: valore corrente, precedente, differenza assoluta e relativa in punti base (assente
        se il precedente è 0); stesse basi di data del riepilogo (soggiorno e incasso). La serie sovrappone
        l'anno precedente a quello corrente per giorno di calendario (un 29 febbraio precedente si somma al
        28 febbraio; un 29 febbraio corrente non ha riscontro), quindi un valore non finisce mai nel mese
        sbagliato. Con `align=weekday` il periodo di confronto ha la stessa durata ma inizia nel giorno
        della settimana uguale più vicino alla data di calendario corrispondente (es. sabato con sabato:
        364 giorni prima per l'anno precedente) e la serie allinea giorno per giorno. Permesso reports.read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - name: compare_year
          in: query
          required: false
          description: "Anno di confronto (default: anno di from − 1); deve precedere l'anno di from."
          schema:
            type: integer
            minimum: 2000
            maximum: 2999
        - name: granularity
          in: query
          required: false
          description: "Granularità della serie (default week)."
          schema:
            $ref: "#/components/schemas/ComparisonGranularity"
        - name: align
          in: query
          required: false
          description: "Allineamento del periodo di confronto (default calendar)."
          schema:
            $ref: "#/components/schemas/ComparisonAlign"
        - $ref: "#/components/parameters/ReportFormat"
      responses:
        "200":
          description: Confronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearComparisonReport"
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ---- M5A: API keys (spec 16, 17) --------------------------------------------
  # Managed only by users with users.manage (owner); requests authenticated
  # with an API key get 403 forbidden on every api-keys/webhook-endpoints
  # operation (a key never manages keys or webhooks).
  /api/admin/v1/establishments/{establishmentId}/api-keys:
    get:
      operationId: listAPIKeys
      tags: [integrations]
      summary: Chiavi API dello stabilimento (mai il segreto)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - name: include_revoked
          in: query
          required: false
          description: "Include anche le chiavi revocate (default false)."
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Chiavi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createAPIKey
      tags: [integrations]
      summary: Crea una chiave API (il segreto è restituito una sola volta)
      description: >-
        Il segreto `ar_live_<prefix>_<secret>` compare solo in questa risposta (Cache-Control: no-store)
        ed è salvato come hash. Niente Idempotency-Key: la risposta conterrebbe il segreto e verrebbe
        memorizzata. Gli scope sono permessi (Permission) tranne users.manage. Audit api_key.created.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyCreate"
      responses:
        "201":
          description: Chiave creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/api-keys/{apiKeyId}:
    get:
      operationId: getAPIKey
      tags: [integrations]
      summary: Dettaglio di una chiave API
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ApiKeyID"
      responses:
        "200":
          description: Chiave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: updateAPIKey
      tags: [integrations]
      summary: Rinomina, cambia scope o scadenza di una chiave attiva
      description: >-
        Campi assenti invariati; `clear_expiry: true` rimuove la scadenza. Una chiave revocata non si
        modifica (409 conflict). Audit api_key.updated.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ApiKeyID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyUpdate"
      responses:
        "200":
          description: Chiave aggiornata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: revokeAPIKey
      tags: [integrations]
      summary: Revoca una chiave (immediata e definitiva; la riga resta per l'audit)
      security:
        - cookieAuth: []
      parameters:
