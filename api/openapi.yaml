        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/bookings:
    post:
      operationId: createPublicBooking
      tags: [public]
      summary: Crea la prenotazione in stato held e la sessione di checkout
      description: >-
        Spec 10.1 passo 3. Occupa le risorse con un hold di `ARENILE_HOLD_TTL` (vincoli del database, quota
        online inclusa) e crea la sessione di checkout. Il token restituito (`checkout_token`, 256 bit, salvato
        solo come hash) va conservato dal client in `sessionStorage` (fallback in memoria) e inviato come header
        `X-Arenile-Checkout` sulle chiamate successive: nessun cookie di terze parti (spec 12.2).
        `Idempotency-Key` consigliata (doppio tocco su rete lenta). Limite creazioni: 10/min per IP.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PreviewToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicBookingCreate"
      responses:
        "201":
          description: Prenotazione provvisoria creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/bookings/{bookingId}:
    get:
      operationId: getPublicBooking
      tags: [public]
      summary: Stato della prenotazione e della sessione di checkout (polling)
      description: >-
        Spec 10.1 passo 7: la pagina interroga lo stato dopo il ritorno dal provider fino a `confirmed`.
        Questa chiamata NON conferma mai (INV-19): la conferma arriva solo dal webhook o dal driver manuale.
        Richiede `X-Arenile-Checkout`; token errato o di un'altra prenotazione → 404 `checkout_not_found`.
        `Cache-Control: no-store`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/BookingID"
        - $ref: "#/components/parameters/CheckoutToken"
      responses:
        "200":
          description: Stato del checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: updatePublicBooking
      tags: [public]
      summary: Dati del cliente, consensi, extra e codice promozionale
      description: >-
        Spec 10.1 passo 4, 12.3 passo 4, 23. Valido solo mentre la prenotazione è `held`: salva il cliente
        (riusato se email o telefono coincidono con un cliente dello stabilimento), la versione delle condizioni
        accettata (`accept_terms_version` deve essere la versione corrente: altrimenti 409 `conflict`) con
        l'istante, il consenso marketing separato con data, fonte `online` e versione del testo. Extra e codice
        promozionale ricalcolano il prezzo. Hold scaduto → 410 `hold_expired`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/BookingID"
        - $ref: "#/components/parameters/CheckoutToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutCustomerInput"
      responses:
        "200":
          description: Stato aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: abandonPublicBooking
      tags: [public]
      summary: Abbandono del checkout, rilascia l'hold
      description: >-
        La prenotazione `held` passa a `expired` (stessa transizione della scadenza) e le risorse sono liberate
        nella stessa transazione. Idempotente; su una prenotazione già confermata risponde 409 `invalid_transition`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/BookingID"
        - $ref: "#/components/parameters/CheckoutToken"
      responses:
        "204":
          description: Hold rilasciato
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/bookings/{bookingId}/pay:
    post:
      operationId: payPublicBooking
      tags: [public]
      summary: Avvia il pagamento (o conferma senza pagamento online)
      description: >-
        Spec 10.1 passo 5, 13.2. Richiede dati cliente e condizioni accettate (altrimenti 422 `validation_failed`).
        Con il provider online attivo (Stripe Checkout) la prenotazione passa a `pending_payment`, l'hold è esteso
        fino all'esito (max 30 minuti) e la risposta contiene `redirect_url` da aprire nella finestra principale
        (`target=_top` dal widget, nuova scheda se il contenitore lo impedisce). Con policy `payment.mode = none`
        o provider `manual` la prenotazione è confermata dal driver manuale (o va in `awaiting_approval`) e la
        risposta ha `mode = none`. Provider non raggiungibile → 503 `payment_provider_unavailable` (l'hold resta).
        Provider configurato in modalità test (chiavi di prova) per una prenotazione reale, cioè con la modalità
        prova (spec 15.4) spenta → 409 `payment_provider_test_mode`: nessun pagamento parte (INV-88).
        `Idempotency-Key` consigliata; la chiave verso il provider è `booking_id + tentativo` (spec 13.2).
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/BookingID"
        - $ref: "#/components/parameters/CheckoutToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutPayRequest"
      responses:
        "200":
          description: Istruzioni per completare il pagamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/public/v1/{slug}/bookings/{bookingId}/qr:
    get:
      operationId: getPublicBookingQr
      tags: [public]
      summary: QR della prenotazione confermata (SVG o PNG)
      description: >-
        Il QR codifica `qr_payload` (codice prenotazione per il check-in in cassa). Richiede `X-Arenile-Checkout`:
        il client lo scarica con fetch e mostra un blob URL. 404 finché la prenotazione non è confermata.
      security: []
