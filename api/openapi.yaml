        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/bookings/{bookingId}/ics:
    get:
      operationId: getPublicBookingIcs
