      description: >-
        Spec 29.1. Solo da loopback e solo finché non esistono utenti. Richiede il token monouso generato dal
        launcher a ogni avvio e passato al browser nel frammento dell'URL (`/admin/first-run#token=...`, mai
        in query string né nei log). In caso di successo esegue l'accesso (cookie di sessione e CSRF come
        `login`) e il pannello prosegue con la configurazione guidata (sezione 15.2).
      security: []
