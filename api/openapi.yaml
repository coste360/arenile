    post:
      operationId: restoreDesktopBackup
      tags: [desktop]
      summary: Pianifica il ripristino di un backup (riavvio del server interno)
      description: >-
        Il database è in uso, quindi il ripristino avviene al riavvio: il launcher ferma il server, salva il
        database corrente come `pre_restore`, copia il backup validato e riavvia. Il pannello mostra un
        messaggio e si ricarica. Solo edizione desktop, da loopback, utente owner.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BackupName"
