          schema:
            $ref: "#/components/schemas/Date"
        - name: to
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Date"
        - name: slots
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Slots"
        - name: formula
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Formula"
        - name: zone_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            x-go-type: string
        - name: spot_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        "200":
          description: Catalogo online
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCatalog"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
