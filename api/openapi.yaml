      properties:
        code:
          type: string
        status:
          type: string
          enum: [applied, invalid, not_applicable]
    PaymentPlan:
      type: string
      enum: [online_full, online_deposit, at_desk, approval]
      description: >-
        Come si paga secondo la policy online: tutto online, acconto online e saldo dopo, alla cassa (nessun
        pagamento online), su approvazione del gestore.
    PublicQuote:
      type: object
      required: [available, conflicts, currency, total, deposit_due, due_now, balance_later, items, violations, payment_plan]
      properties:
        available:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AllocationConflict"
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        deposit_due:
          $ref: "#/components/schemas/Money"
        due_now:
          $ref: "#/components/schemas/Money"
        balance_later:
          $ref: "#/components/schemas/Money"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicQuoteItem"
        violations:
          type: array
          items:
            $ref: "#/components/schemas/PolicyViolation"
        promo:
          $ref: "#/components/schemas/PromoStatus"
        payment_plan:
          $ref: "#/components/schemas/PaymentPlan"
    CheckoutSessionState:
      type: string
      enum: [open, paying, completed, expired, abandoned]
    CheckoutSession:
      type: object
      required: [booking_id, checkout_token, status, hold_expires_at, quote]
      properties:
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        checkout_token:
          type: string
          description: Token della sessione (restituito solo qui); header `X-Arenile-Checkout`.
        status:
          $ref: "#/components/schemas/BookingStatus"
        hold_expires_at:
          type: string
          format: date-time
        quote:
          $ref: "#/components/schemas/PublicQuote"
    PublicBookingExtra:
      type: object
      required: [extra_id, name, quantity]
      properties:
        extra_id:
          type: string
          format: uuid
          x-go-type: string
        name:
          $ref: "#/components/schemas/I18nText"
        quantity:
          type: integer
    PublicBookingLine:
      type: object
      required: [pack_id, pack_name, quantity, assignment, extras]
      properties:
        pack_id:
          type: string
          format: uuid
          x-go-type: string
        pack_name:
          $ref: "#/components/schemas/I18nText"
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        zone_name:
          $ref: "#/components/schemas/I18nText"
        spot_label:
          type: string
          description: Assente finché una riga di una zona `zone` non è assegnata (assegnazione automatica, spec 7.5).
        quantity:
          type: integer
        assignment:
          $ref: "#/components/schemas/AssignmentStatus"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingExtra"
    PublicBookingSummary:
      type: object
      required: [starts_on, ends_on, slots, formula, lines, extras, currency, total, paid, balance_due, deposit_due]
      properties:
        code:
          type: string
          description: Codice prenotazione (presente dalla conferma).
        starts_on:
          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingLine"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/PublicBookingExtra"
        currency:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        balance_due:
          $ref: "#/components/schemas/Money"
        deposit_due:
          $ref: "#/components/schemas/Money"
    CheckoutCustomer:
      type: object
      description: Dati inseriti dal cliente in questa sessione (solo con il token della sessione).
      required: [first_name, last_name, email, marketing_consent]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        phone:
          type: string
        accepted_terms_version:
          type: string
        marketing_consent:
          type: boolean
    PublicPaymentState:
      type: object
      required: [status, amount]
      properties:
        status:
          type: string
          enum: [none, pending, succeeded, failed]
        amount:
          $ref: "#/components/schemas/Money"
        failure_reason:
          type: string
          description: Motivo breve e non personale (es. card_declined).
    CheckoutNextAction:
      type: string
      enum: [details, pay, wait, done, expired, rejected]
      description: >-
        details: mancano dati cliente o condizioni; pay: pronto per il pagamento; wait: pagamento avviato o
        approvazione in attesa, continuare il polling; done: confermata; expired: hold scaduto o abbandonato;
        rejected: rifiutata dal gestore.
    PublicConfirmation:
      type: object
      required: [code, qr_payload, manage_link_sent]
      properties:
        code:
          type: string
        qr_payload:
          type: string
          description: Testo codificato nel QR (check-in in cassa).
        qr_svg:
          type: string
          description: QR in SVG in linea (evita una seconda richiesta).
        manage_link_sent:
          type: boolean
        email_masked:
          type: string
          description: Email del cliente mascherata (m***o@e***.it).
    CheckoutState:
      type: object
      required: [booking_id, status, checkout_state, next_action, summary]
      properties:
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        checkout_state:
          $ref: "#/components/schemas/CheckoutSessionState"
        hold_expires_at:
          type: string
          format: date-time
        next_action:
          $ref: "#/components/schemas/CheckoutNextAction"
        summary:
          $ref: "#/components/schemas/PublicBookingSummary"
        quote:
          $ref: "#/components/schemas/PublicQuote"
        customer:
          $ref: "#/components/schemas/CheckoutCustomer"
        payment:
          $ref: "#/components/schemas/PublicPaymentState"
        confirmation:
          $ref: "#/components/schemas/PublicConfirmation"
    CheckoutCustomerInput:
      type: object
      required: [first_name, last_name, email, accept_terms_version, marketing_consent]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
          description: E.164 o numero italiano; facoltativo (ADR 0020), usato per la deduplica solo se presente.
        locale:
          type: string
          pattern: ^[a-z]{2}$
        accept_terms_version:
          type: string
          maxLength: 40
          description: Versione delle condizioni mostrata e accettata (deve essere la corrente).
        marketing_consent:
          type: boolean
          description: Consenso marketing separato e facoltativo (spec 23).
        notes:
          type: string
          maxLength: 500
        promo_code:
          type: string
          maxLength: 40
        extras:
          type: array
          maxItems: 20
          description: Sostituisce gli extra della prenotazione (attach_to = booking) se presente.
          items:
            $ref: "#/components/schemas/PublicExtraInput"
    CheckoutPayRequest:
      type: object
      properties:
        settlement:
          type: string
          enum: [online, at_desk]
          description: at_desk solo se la policy online consente il pagamento in cassa.
        return_to:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Solo dal widget incorporato: indirizzo della pagina ospitante, la cui origine deve essere tra gli
            `allowed_embed_origins` dello stabilimento (altrimenti 422 `validation_error`). Il provider riporta il
            cliente lì con `arenile_checkout=<booking_id>` (frammento rimosso) ed `embed.js` riapre il widget sulla
            pagina di esito, dove il token di sessione è ancora disponibile. Senza questo campo si torna su
            `/b/{slug}?checkout=<booking_id>`.
    PayResult:
      type: object
      required: [mode, status]
      properties:
        mode:
          type: string
          enum: [redirect, embedded, none]
          description: redirect → aprire redirect_url nella finestra principale; embedded → Payment Element; none → nessun passo online.
        status:
          $ref: "#/components/schemas/BookingStatus"
        redirect_url:
          type: string
        client_secret:
          type: string
        publishable_key:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        hold_expires_at:
          type: string
          format: date-time
    ManageActions:
      type: object
      required: [pay_balance, modify, cancel, release_days]
      properties:
        pay_balance:
          type: boolean
        modify:
          type: boolean
        cancel:
          type: boolean
        release_days:
          type: boolean
        modify_until:
          $ref: "#/components/schemas/Date"
        cancel_until_free:
          $ref: "#/components/schemas/Date"
          description: Ultimo giorno con rimborso pieno, se previsto dalla policy.
    ManageCustomer:
      type: object
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email_masked:
          type: string
        phone_masked:
          type: string
    ManageRelease:
      type: object
      required: [date, slot, credit_amount]
      properties:
        date:
          $ref: "#/components/schemas/Date"
        slot:
          $ref: "#/components/schemas/Slot"
        credit_amount:
          $ref: "#/components/schemas/Money"
        resold:
          type: boolean
    ManageBooking:
      type: object
      required: [booking_id, code, status, is_season_pass, summary, customer, allowed, qr_payload, link_expires_at, version]
      properties:
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        code:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        is_season_pass:
          type: boolean
        summary:
          $ref: "#/components/schemas/PublicBookingSummary"
        customer:
          $ref: "#/components/schemas/ManageCustomer"
        allowed:
          $ref: "#/components/schemas/ManageActions"
        refund:
          $ref: "#/components/schemas/ManageRefundStatus"
        cancellation_preview:
          $ref: "#/components/schemas/RefundPreview"
        releases:
          type: array
          items:
            $ref: "#/components/schemas/ManageRelease"
        qr_payload:
          type: string
        qr_svg:
          type: string
        link_expires_at:
          type: string
          format: date-time
        renewal:
          $ref: "#/components/schemas/PublicRenewalProposal"
        credit_available:
          $ref: "#/components/schemas/Money"
        version:
          $ref: "#/components/schemas/Version"
    ManageModifyRequest:
      allOf:
        - $ref: "#/components/schemas/PublicSelection"
        - type: object
          properties:
            dry_run:
              type: boolean
              description: Default true (solo anteprima); false applica la modifica.
    ManageModifyResult:
      type: object
      required: [applied, previous_total, new_total, difference, conflicts, violations]
      properties:
        applied:
          type: boolean
        previous_total:
          $ref: "#/components/schemas/Money"
        new_total:
          $ref: "#/components/schemas/Money"
        difference:
          $ref: "#/components/schemas/Money"
          description: Positiva da pagare, negativa da rimborsare (spec 10.3); include la penale di modifica.
        fee:
          $ref: "#/components/schemas/Money"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AllocationConflict"
        violations:
          type: array
          items:
            $ref: "#/components/schemas/PolicyViolation"
        quote:
          $ref: "#/components/schemas/PublicQuote"
        booking:
          $ref: "#/components/schemas/ManageBooking"
    ManageCancelRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          description: Default true (solo anteprima); false cancella.
        reason:
          type: string
          maxLength: 500
        settlement:
          type: string
          enum: [refund, credit]
          description: Preferenza del cliente quando la policy consente entrambe.
    ManageCancelResult:
      type: object
      required: [applied, refund]
      properties:
        applied:
          type: boolean
        refund:
          $ref: "#/components/schemas/RefundPreview"
        refund_status:
          type: string
          enum: [none, provider_pending, provider_succeeded, manual_due, credited]
        booking:
          $ref: "#/components/schemas/ManageBooking"
    ManageReleaseDay:
      type: object
      required: [date, slots]
      properties:
        date:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
    ManageReleaseRequest:
      type: object
      required: [days]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 120
          items:
            $ref: "#/components/schemas/ManageReleaseDay"
        dry_run:
          type: boolean
          description: Default true (solo anteprima); false rilascia.
    ManageReleaseResult:
      type: object
      required: [applied, released, credit_amount]
      properties:
        applied:
          type: boolean
        released:
          type: array
          items:
            $ref: "#/components/schemas/ManageRelease"
        credit_amount:
          $ref: "#/components/schemas/Money"
        booking:
          $ref: "#/components/schemas/ManageBooking"
    ManageLinkRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        code:
          type: string
          minLength: 4
          maxLength: 32
    WebhookAck:
      type: object
      required: [received]
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean

    # ---- M4: admin online settings, payments, email ---------------------------
    OnlineFlowConfig:
      type: object
      description: Opzioni del flusso pubblico.
      required: [formulas, slots, show_rate_periods, promo_codes_enabled, require_phone]
      properties:
        formulas:
          type: array
          description: Formule proposte online (vuoto = tutte quelle ammesse dai pack online).
          items:
            $ref: "#/components/schemas/Formula"
        slots:
          type: array
          description: Fasce proposte online (default FULL, AM, PM).
          items:
            $ref: "#/components/schemas/Slots"
        show_rate_periods:
          type: boolean
          description: Evidenzia i periodi tariffari nel calendario pubblico.
        max_days_ahead:
          type: integer
          minimum: 0
          maximum: 730
          description: Limite di prenotabilità in giorni (oltre alla policy).
        promo_codes_enabled:
          type: boolean
        require_phone:
          type: boolean
          deprecated: true
          description: >-
            Ignorato e salvato sempre come false: il telefono è facoltativo ovunque (ADR 0020).
    EmbedSnippets:
      type: object
      required: [page_url, iframe, script]
      properties:
        page_url:
          type: string
          description: "`<ARENILE_BASE_URL>/b/<slug>`"
        iframe:
          type: string
        script:
          type: string
    OnlineSettings:
      type: object
      required: [booking_enabled, allowed_embed_origins, theme, flow, embed, version]
      properties:
        booking_enabled:
          type: boolean
        allowed_embed_origins:
          type: array
          items:
            type: string
        theme:
          $ref: "#/components/schemas/Theme"
        flow:
          $ref: "#/components/schemas/OnlineFlowConfig"
        current_terms:
          $ref: "#/components/schemas/TermsVersion"
        embed:
          $ref: "#/components/schemas/EmbedSnippets"
        version:
          $ref: "#/components/schemas/Version"
    OnlineSettingsInput:
      type: object
      required: [booking_enabled, allowed_embed_origins, theme, flow]
      properties:
        booking_enabled:
          type: boolean
        allowed_embed_origins:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 255
        theme:
          $ref: "#/components/schemas/Theme"
        flow:
          $ref: "#/components/schemas/OnlineFlowConfig"
    TermsVersion:
      type: object
      required: [id, version, texts, published_at, current]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        version:
          type: string
        texts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TermsTexts"
        published_at:
          type: string
          format: date-time
        current:
          type: boolean
    TermsVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TermsVersion"
    TermsVersionInput:
      type: object
      required: [version, texts]
      properties:
        version:
          type: string
          minLength: 1
          maxLength: 40
        texts:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TermsTexts"
        make_current:
          type: boolean
          description: Default true.
    ProviderMode:
      type: string
      enum: [test, live]
    StripeSettings:
      type: object
      required: [configured, webhook_secret_configured, embedded_mode]
      properties:
        configured:
          type: boolean
          description: Chiave segreta salvata.
        publishable_key:
          type: string
        secret_key_last4:
          type: string
        webhook_secret_configured:
          type: boolean
        embedded_mode:
          type: boolean
        verified_at:
          type: string
          format: date-time
    StripeSettingsInput:
      type: object
      properties:
        publishable_key:
          type: string
          maxLength: 255
          pattern: ^(pk_(test|live)_[A-Za-z0-9]+)?$
        secret_key:
          type: string
          writeOnly: true
          maxLength: 255
          description: Assente = invariata; vuota = cancella. Mai restituita.
        webhook_secret:
          type: string
          writeOnly: true
          maxLength: 255
          description: Assente = invariato; vuoto = cancella. Mai restituito.
        embedded_mode:
          type: boolean
    PaymentSettings:
      type: object
      required: [provider, available_providers, mode, stripe, webhook_url, live_payments_blocked, version]
      properties:
        provider:
          type: string
          description: Provider attivo per la pagina pubblica (`manual` = nessun pagamento online).
        available_providers:
          type: array
          items:
            type: string
        mode:
          $ref: "#/components/schemas/ProviderMode"
        stripe:
          $ref: "#/components/schemas/StripeSettings"
        webhook_url:
          type: string
          description: "URL da configurare presso il provider: `<base>/webhooks/payments/<provider>/<establishment_id>`."
        live_payments_blocked:
          type: boolean
          description: >-
            Vero quando il provider attivo (non `manual`) è in modalità `test` e la modalità prova dello
            stabilimento (spec 15.4) è spenta: i clienti reali non possono pagare online (INV-88). Per
            sbloccare usa le chiavi live oppure accendi la modalità prova per provare il flusso.
        version:
          $ref: "#/components/schemas/Version"
    PaymentSettingsInput:
      type: object
      required: [provider, mode]
      properties:
        provider:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,31}$
        mode:
          $ref: "#/components/schemas/ProviderMode"
        stripe:
          $ref: "#/components/schemas/StripeSettingsInput"
