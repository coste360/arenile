          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        is_season_pass:
          type: boolean
        test:
          type: boolean
          description: "Creata in modalità prova (spec 15.4): esclusa da report, KPI, corrispettivi ed esportazioni."
        pack_codes:
          type: array
          items:
            type: string
        total_amount:
          $ref: "#/components/schemas/Money"
        paid_amount:
          $ref: "#/components/schemas/Money"
        balance_due:
          $ref: "#/components/schemas/Money"
        has_notes:
          type: boolean
        has_extras:
          type: boolean
        version:
          allOf:
            - $ref: "#/components/schemas/Version"
