openapi: 3.1.0
info:
  title: Arenile API
  version: 0.1.0
  summary: Gestionale gratuito per stabilimenti balneari, codice sorgente disponibile (BSL 1.1).
  description: |
    Contratto unico (spec-first) delle API REST di Arenile.

    - `/api/admin/v1` — API del pannello del gestore (sessione via cookie o chiave API).
    - `/api/public/v1` — API pubblica della pagina di prenotazione.
    - `/api/device/v1` — API dei dispositivi abbinati (token per dispositivo, spec 29.2).
    - `/api/desktop/v1` — edizione desktop, solo da 127.0.0.1 (spec 29.1).

    Convenzioni (specifica, sezione 17.1):
    - errori in `application/problem+json` (RFC 9457) con `type` stabile (slug);
    - paginazione a cursore (`?cursor=&limit=`);
    - `Idempotency-Key` accettato sui `POST` che creano risorse o pagamenti;
    - le richieste del pannello autenticate via cookie che modificano dati
      devono inviare l'header `X-CSRF-Token` uguale al cookie `arenile_csrf`;
    - date di calendario `YYYY-MM-DD`, istanti RFC 3339 UTC.
  license:
    name: Business Source License 1.1
    identifier: BUSL-1.1
  contact:
    name: Coste360 SRL
    url: https://arenile.app
externalDocs:
  description: Documentazione di Arenile
  url: https://docs.arenile.app
servers:
  - url: /
    description: Stessa origine dell'istanza Arenile
tags:
  - name: ops
    description: Stato del processo
  - name: auth
    description: Autenticazione del pannello
  - name: establishments
    description: Stabilimenti
  - name: team
    description: Utenti e ruoli dello stabilimento
  - name: seasons
    description: Stagioni, periodi tariffari e chiusure
  - name: maps
    description: Mappe, zone, postazioni, decorazioni e pool
  - name: catalog
    description: Componenti, pack ed extra
  - name: pricing
    description: Listini, codici promozionali, convenzioni e strumenti dei prezzi
  - name: policies
    description: Policy di prenotazione
  - name: setup
    description: Configurazione guidata
  - name: customers
    description: Clienti, ricerca, esportazione e anonimizzazione GDPR
  - name: bookings
    description: Prenotazioni dal pannello, azioni di stato, modifiche e assegnazioni
  - name: availability
    description: Disponibilità, hold e blocchi delle postazioni
  - name: operations
    description: Vista operativa del giorno e calendario planning
  - name: passes
    description: Abbonamenti stagionali e rilasci
  - name: renewals
    description: Campagne di rinnovo degli abbonamenti e diritto di prelazione (spec 10.4)
  - name: waitlist
    description: Lista d'attesa e offerte con hold riservato (spec 10.5)
  - name: payments
    description: Pagamenti manuali, rimborsi e vendite di cassa
  - name: cash
    description: Sessioni di cassa, movimenti e chiusure
  - name: tickets
    description: Vendita giornaliera rapida, biglietti numerati del giorno, assegnazione, ingressi e varco
  - name: fiscal
    description: Corrispettivi e documenti fiscali
  - name: realtime
    description: Eventi in tempo reale (SSE)
  - name: public
    description: API pubblica della pagina di prenotazione
  - name: online
    description: Pagina pubblica, condizioni, provider di pagamento ed email (impostazioni del gestore)
  - name: webhooks
    description: Webhook in ingresso dei provider di pagamento
  - name: meta
    description: Versione, edizione e capacità dell'istanza (app mobile e desktop, spec 29.2)
  - name: devices
    description: Dispositivi abbinati (app mobile e desktop remota), codici di abbinamento e revoca
  - name: device
    description: API dei dispositivi abbinati con token per dispositivo (spec 29.2)
  - name: fiscal-bridge
    description: Ponte fiscale verso il FiscalDriver locale dell'app desktop in modalità remota (spec 29.1, 14.2)
  - name: desktop
    description: Edizione desktop, solo da 127.0.0.1 (primo avvio, impostazioni, backup e ripristino, spec 29.1)
  - name: reports
    description: Report, esportazioni CSV e confronto con l'anno precedente
  - name: integrations
    description: Chiavi API e webhook in uscita
  - name: printing
    description: Stampanti ESC/POS di rete, instradamento dei documenti e lavori di stampa (edizione desktop, ADR 0021)

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [ops]
      summary: Processo vivo
      security: []
      responses:
        "200":
          description: Il processo risponde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadyz
      tags: [ops]
      summary: Pronto a servire (database raggiungibile, migrazioni allineate)
      security: []
      responses:
        "200":
          description: Pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Non pronto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /api/admin/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Accesso con email e password (e codice TOTP se attivo)
      description: |
        In caso di successo imposta il cookie di sessione `arenile_session`
        (HttpOnly, Secure, SameSite=Lax) e il cookie `arenile_csrf`.
        Il token di sessione viene sempre ruotato.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Accesso effettuato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/admin/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Chiude la sessione corrente
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Sessione chiusa
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/v1/auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Utente corrente, appartenenze e permessi
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Utente corrente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/admin/v1/auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [auth]
      summary: Avvia l'attivazione del secondo fattore TOTP
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Segreto da registrare nell'app di autenticazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TotpEnrollment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/auth/totp/confirm:
    post:
      operationId: confirmTotp
      tags: [auth]
      summary: Conferma l'attivazione del TOTP con un codice valido
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TotpConfirmRequest"
      responses:
        "204":
          description: TOTP attivo
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/admin/v1/establishments:
    get:
      operationId: listEstablishments
      tags:
        - establishments
      summary: Stabilimenti accessibili all'utente corrente
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pagina di stabilimenti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishmentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createEstablishment
      tags:
        - establishments
      summary: Crea un nuovo stabilimento (solo proprietari)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentCreate"
      responses:
        "201":
          description: Stabilimento creato
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/establishments/{establishmentId}:
    get:
      operationId: getEstablishment
      tags:
        - establishments
      summary: Dettaglio di uno stabilimento
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
      responses:
        "200":
          description: Stabilimento
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateEstablishment
      tags:
        - establishments
      summary: Aggiorna, archivia o ripristina uno stabilimento
      description: Configurazione (owner, manager). L'archiviazione è riservata ai proprietari.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishmentUpdate"
      responses:
        "200":
          description: Stabilimento aggiornato
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Establishment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/admin/v1/establishments/{establishmentId}/team:
    get:
      operationId: listTeamMembers
      tags:
        - team
      summary: Utenti con accesso allo stabilimento
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pagina di utenti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createTeamMember
      tags:
        - team
      summary: Crea o invita un utente con un ruolo (solo owner)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberCreate"
      responses:
        "201":
          description: Utente aggiunto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/establishments/{establishmentId}/team/{userId}:
    patch:
      operationId: updateTeamMember
      tags:
        - team
      summary: Cambia ruolo o disattiva un utente (solo owner)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/TeamUserID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Utente aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: removeTeamMember
      tags:
        - team
      summary: Revoca l'accesso dell'utente allo stabilimento (solo owner)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/TeamUserID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Accesso revocato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/establishments/{establishmentId}/seasons:
    get:
      operationId: listSeasons
      tags:
        - seasons
      summary: Elenco stagioni
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pagina di stagioni
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSeason
      tags:
        - seasons
      summary: Crea stagione
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonInput"
      responses:
        "201":
          description: Stagione creato/a
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/establishments/{establishmentId}/seasons/{seasonId}:
    get:
      operationId: getSeason
      tags:
        - seasons
      summary: Dettaglio stagione
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/SeasonID"
      responses:
        "200":
          description: Stagione
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateSeason
      tags:
        - seasons
      summary: Sostituisce stagione
      description: >-
        Sostituzione completa (i campi facoltativi assenti vengono azzerati). If-Match facoltativo ma
        consigliato.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/SeasonID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonInput"
      responses:
        "200":
          description: Stagione aggiornato/a
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
    delete:
      operationId: deleteSeason
      tags:
        - seasons
      summary: Elimina stagione
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/SeasonID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Eliminato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/admin/v1/establishments/{establishmentId}/seasons/{seasonId}/copy:
    post:
      operationId: copySeason
      tags:
        - seasons
      summary: Copia stagione sull'anno indicato (periodi, regole, prezzi fissi, policy)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/SeasonID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeasonCopyRequest"
      responses:
        "201":
          description: Stagione copiata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonCopyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/establishments/{establishmentId}/rate-periods:
    get:
      operationId: listRatePeriods
      tags:
        - seasons
      summary: Elenco periodi tariffari
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - name: season_id
          in: query
          required: false
          description: Filtra per stagione.
          schema:
            type: string
            format: uuid
            x-go-type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pagina di periodi tariffari
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePeriodList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createRatePeriod
      tags:
        - seasons
      summary: Crea periodo tariffario
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatePeriodInput"
      responses:
        "201":
          description: Periodo tariffario creato/a
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePeriod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/v1/establishments/{establishmentId}/rate-periods/{ratePeriodId}:
    get:
      operationId: getRatePeriod
      tags:
        - seasons
      summary: Dettaglio periodo tariffario
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/RatePeriodID"
      responses:
        "200":
          description: Periodo tariffario
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatePeriod"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRatePeriod
      tags:
        - seasons
