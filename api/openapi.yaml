        - zones
        - packs
        - rate_periods
      properties:
        code:
          $ref: "#/components/schemas/SetupTemplateCode"
        name:
          $ref: "#/components/schemas/I18nText"
        description:
          $ref: "#/components/schemas/I18nText"
        rows:
          type: integer
          description: File proposte (0 se nessuna mappa a file).
        spots_per_row:
          type: integer
        zones:
          type: array
          items:
            $ref: "#/components/schemas/SetupTemplateZone"
        packs:
          type: array
          items:
            $ref: "#/components/schemas/SetupTemplatePack"
        rate_periods:
          type: array
          items:
            type: string
          description: Codici dei periodi proposti.
    SetupTemplateList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SetupTemplate"
    ApplyTemplateRequest:
      type: object
      required:
        - template
      properties:
        template:
          $ref: "#/components/schemas/SetupTemplateCode"
        season_year:
          type: integer
          minimum: 2000
          maximum: 2100
        opens_on:
          $ref: "#/components/schemas/Date"
        closes_on:
          $ref: "#/components/schemas/Date"
        rows:
          type: integer
          minimum: 0
          maximum: 52
        spots_per_row:
          type: integer
          minimum: 0
          maximum: 200
        map_name:
          $ref: "#/components/schemas/I18nText"
    ApplyTemplateResult:
      type: object
      required:
        - template
        - zone_ids
        - pool_ids
        - component_ids
        - pack_ids
        - extra_ids
        - rate_period_ids
        - spots_created
      properties:
        template:
          $ref: "#/components/schemas/SetupTemplateCode"
        season_id:
          type: string
          format: uuid
          x-go-type: string
        map_id:
          type: string
          format: uuid
          x-go-type: string
        zone_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
        pool_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
        component_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
        pack_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
        extra_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
        rate_period_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
        spots_created:
          type: integer
    QuickPrice:
      type: object
      required:
        - price_category
        - rate_period_code
        - amount
      properties:
        price_category:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
        rate_period_code:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
        amount:
          $ref: "#/components/schemas/Money"
    QuickPricelistRequest:
      type: object
      description: "Listino rapido: prezzo giornaliero per categoria e periodo → regole base (spec 15.2)."
      required:
        - season_id
        - prices
      properties:
        season_id:
          type: string
          format: uuid
          x-go-type: string
        pack_ids:
          type: array
          items:
            type: string
            format: uuid
            x-go-type: string
          description: Vuoto = tutti i pack attivi.
        prices:
          type: array
          items:
            $ref: "#/components/schemas/QuickPrice"
          minItems: 1
        replace_existing:
          type: boolean
          description: true sostituisce le regole base generate in precedenza dal listino rapido.
    QuickPricelistResult:
      type: object
      required:
        - rules
        - replaced
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PriceRule"
        replaced:
          type: integer
    SetupStatus:
      type: object
      description: Avanzamento della configurazione guidata.
      required:
        - has_season
        - has_rate_periods
        - has_map
        - spot_count
        - has_catalog
        - has_prices
        - booking_enabled
        - price_categories
        - has_operations
      properties:
        price_categories:
          type: array
          description: >-
            Categorie di prezzo in uso (zone e override delle postazioni), ordinate: il listino rapido
            richiede un prezzo per ciascuna in ogni periodo tariffario.
          items:
            type: string
        has_season:
          type: boolean
        has_rate_periods:
          type: boolean
        has_map:
          type: boolean
        spot_count:
          type: integer
        has_catalog:
          type: boolean
        has_prices:
          type: boolean
        booking_enabled:
          type: boolean
        has_operations:
          type: boolean
          description: >-
            Lo stabilimento ha dati operativi (prenotazioni, abbonamenti, incassi, sessioni di cassa, biglietti,
            lista d'attesa, rinnovi o crediti): la configurazione si ricomincia solo azzerando tutto.
    SetupResetRequest:
      type: object
      required: [scope, confirm_name]
      properties:
        scope:
          type: string
          enum: [configuration, everything]
          description: "`configuration`: solo la configurazione; `everything`: anche i dati operativi."
        confirm_name:
          type: string
          description: Nome dello stabilimento, scritto per confermare (spazi iniziali e finali ignorati).
    SetupResetResult:
      type: object
      required: [scope, deleted]
      properties:
        scope:
          type: string
          enum: [configuration, everything]
        deleted:
          type: object
          description: Righe cancellate per tabella (solo quelle con almeno una riga).
          additionalProperties:
            type: integer
            format: int64

    # ---- M3: customers, bookings, availability, passes, payments, cash, fiscal ----
    AllocationConflict:
      type: object
      description: Mezza giornata non disponibile per una risorsa (spec 7.2), restituita in Problem.conflicts e nelle anteprime.
      required: [date, slot, reason]
      properties:
        spot_id:
          type: string
          format: uuid
          x-go-type: string
        pool_id:
          type: string
          format: uuid
          x-go-type: string
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        date:
          $ref: "#/components/schemas/Date"
        slot:
          $ref: "#/components/schemas/Slot"
        reason:
          type: string
          enum: [spot_unavailable, pool_exhausted, quota_exceeded, closed, inactive]
    MarketingConsent:
      type: object
      description: Consenso marketing separato e facoltativo (spec 23).
      required: [given_at, source, text_version]
      properties:
        given_at:
          type: string
          format: date-time
        source:
          type: string
          maxLength: 40
        text_version:
          type: string
          maxLength: 40
    CustomerInput:
      type: object
      description: >-
        Dati minimi per una prenotazione dal pannello: solo il cognome è obbligatorio. Email lowercase; telefono E.164
        facoltativo (ADR 0020), usato per la deduplica solo se presente.
      required: [last_name]
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: ^\+[1-9][0-9]{6,14}$
          description: E.164 (es. +393331234567).
        locale:
          type: string
          enum: [it, en, de, fr]
        notes:
          type: string
          maxLength: 2000
          description: Solo interne, mai mostrate al cliente.
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 30
        agreement_id:
          type: string
          format: uuid
          x-go-type: string
        marketing_consent:
          $ref: "#/components/schemas/MarketingConsent"
    Customer:
      type: object
      required: [id, first_name, last_name, display_name, locale, notes, tags, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        first_name:
          type: string
        last_name:
          type: string
        display_name:
          type: string
          description: Cognome e nome per elenchi e mappa.
        email:
          type: string
        phone:
          type: string
        locale:
          type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        agreement_id:
          type: string
          format: uuid
          x-go-type: string
        marketing_consent:
          $ref: "#/components/schemas/MarketingConsent"
        anonymized_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CustomerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        next_cursor:
          type: string
          description: Presente se esistono altri elementi.
    CustomerStats:
      type: object
      required: [bookings_count, total_spent, balance_due]
      properties:
        bookings_count:
          type: integer
        total_spent:
          $ref: "#/components/schemas/Money"
        balance_due:
          $ref: "#/components/schemas/Money"
        last_booking_on:
          $ref: "#/components/schemas/Date"
    CustomerCredit:
      type: object
      description: Movimento del saldo crediti del cliente (spec 13.4); amount negativo = credito usato.
      required: [id, amount, source, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        amount:
          $ref: "#/components/schemas/Money"
        source:
          type: string
          enum: [cancellation, season_release, weather, manual, redemption, goodwill, expiry, adjustment]
          description: >-
            Origine: cancellation, season_release, weather, manual, goodwill (crediti; goodwill sempre > 0, le altre negative solo come storno); redemption
            (uso come metodo di pagamento `credit`) ed expiry (scadenza) hanno amount < 0; adjustment è una
            rettifica del gestore con segno libero.
        reference_credit_id:
          type: string
          format: uuid
          x-go-type: string
          description: "expiry: il credito scaduto a cui si riferisce."
        booking_id:
          type: string
          format: uuid
          x-go-type: string
        note:
          type: string
        expires_on:
          $ref: "#/components/schemas/Date"
        created_at:
          type: string
          format: date-time
    CustomerDetail:
      type: object
      required: [customer, stats, credit_balance, credits, recent_bookings, season_passes]
      properties:
        customer:
          $ref: "#/components/schemas/Customer"
        stats:
          $ref: "#/components/schemas/CustomerStats"
        credit_balance:
          $ref: "#/components/schemas/Money"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/CustomerCredit"
        recent_bookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingSummary"
        season_passes:
          type: array
          items:
            $ref: "#/components/schemas/SeasonPass"
    CustomerExport:
      type: object
      description: Esportazione GDPR (spec 23).
      required: [exported_at, customer, bookings, payments, credits]
      properties:
        exported_at:
          type: string
          format: date-time
        customer:
          $ref: "#/components/schemas/Customer"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/BookingSummary"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/CustomerCredit"

    BookingStatus:
      type: string
      description: Stato della prenotazione (spec 10.2).
      enum: [draft, held, pending_payment, awaiting_approval, confirmed, checked_in, completed, cancelled, no_show, expired, rejected]
    AssignmentStatus:
      type: string
      enum: [assigned, pending, not_applicable]
    AllocationKind:
      type: string
      enum: [booking, hold, block, season]
    BookingSummary:
      type: object
      required: [id, code, status, channel, customer_id, customer_display_name, starts_on, ends_on, slots, formula, is_season_pass, total_amount, paid_amount, balance_due, deposit_due, spot_labels, version, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        code:
          type: string
          description: Codice leggibile univoco per stabilimento (es. AR-7K3Q9).
        status:
          $ref: "#/components/schemas/BookingStatus"
        channel:
          $ref: "#/components/schemas/Channel"
        customer_id:
          type: string
          format: uuid
          x-go-type: string
        customer_display_name:
          type: string
        starts_on:
          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        is_season_pass:
          type: boolean
        test:
          type: boolean
          description: "Creata in modalità prova (spec 15.4): esclusa da report, KPI, corrispettivi ed esportazioni."
        total_amount:
          $ref: "#/components/schemas/Money"
        paid_amount:
          $ref: "#/components/schemas/Money"
        balance_due:
          $ref: "#/components/schemas/Money"
        deposit_due:
          $ref: "#/components/schemas/Money"
        spot_labels:
          type: array
          items:
            type: string
        hold_expires_at:
          type: string
          format: date-time
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
    BookingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingSummary"
        next_cursor:
          type: string
          description: Presente se esistono altri elementi.
