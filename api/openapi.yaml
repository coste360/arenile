  # ---- M5A: outgoing webhooks (spec 18.2) ---------------------------------------
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints:
    get:
      operationId: listWebhookEndpoints
      tags: [integrations]
      summary: Endpoint dei webhook in uscita (mai il segreto)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createWebhookEndpoint
      tags: [integrations]
      summary: Registra un endpoint (il segreto di firma è restituito una sola volta)
      description: >-
        URL https (http solo verso localhost/127.0.0.1/::1, per sviluppo), senza credenziali nella URL,
        massimo 2048 caratteri. Eventi: tipi di WebhookEventType, `<gruppo>.*` o `*`. Il segreto
        `whsec_…` è cifrato a riposo (AES-GCM, ARENILE_SECRET_KEY) e compare solo in questa risposta.
        Niente Idempotency-Key (la risposta contiene il segreto). Audit webhook.created.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointCreate"
      responses:
        "201":
          description: Endpoint creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpointCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints/{endpointId}:
    get:
      operationId: getWebhookEndpoint
      tags: [integrations]
      summary: Dettaglio di un endpoint
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
      responses:
        "200":
          description: Endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    patch:
      operationId: updateWebhookEndpoint
      tags: [integrations]
      summary: Modifica URL, descrizione, eventi o stato attivo
      description: >-
        Campi assenti invariati. `active: true` riattiva anche un endpoint disattivato automaticamente
        (azzera consecutive_failures, disabled_at e disabled_reason); `active: false` lo mette in pausa
        (le consegne pendenti falliscono con "endpoint disabled"). Audit webhook.updated.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEndpointUpdate"
      responses:
        "200":
          description: Endpoint aggiornato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookEndpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deleteWebhookEndpoint
      tags: [integrations]
      summary: Elimina un endpoint e il suo registro delle consegne
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Eliminato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints/{endpointId}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [integrations]
      summary: Ruota il segreto di firma (il nuovo è restituito una sola volta)
      description: >-
        Durante il periodo di grazia ogni consegna porta due firme v1 nello stesso header
        (`t=…,v1=<nuovo>,v1=<precedente>`), così il ricevente può aggiornare il segreto senza perdere
        eventi. grace_hours 0 revoca subito il precedente. Audit webhook.secret_rotated.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSecretRotate"
      responses:
        "200":
          description: Segreto ruotato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretRotated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints/{endpointId}/test:
    post:
      operationId: sendWebhookTest
      tags: [integrations]
      summary: Invia subito un evento di prova `webhook.test` a questo solo endpoint
      description: >-
        Scrive un evento `webhook.test` già marcato come distribuito (non arriva ad altri endpoint né ai
        sink) e ne tenta la consegna in modo sincrono, un solo tentativo senza ripetizioni (timeout come
        le consegne normali). Funziona anche con endpoint in pausa. Risponde con la consegna e il suo
        esito; il tentativo compare nel registro.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Esito del tentativo (anche se il ricevente ha risposto con errore)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints/{endpointId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [integrations]
      summary: Registro delle consegne dell'endpoint (più recenti prima)
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - name: status
          in: query
          required: false
          description: "Filtra per stato."
          schema:
            $ref: "#/components/schemas/WebhookDeliveryStatus"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pagina di consegne
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints/{endpointId}/deliveries/{deliveryId}:
    get:
      operationId: getWebhookDelivery
      tags: [integrations]
      summary: Dettaglio di una consegna con corpo inviato ed estratto della risposta
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/WebhookDeliveryID"
      responses:
        "200":
          description: Consegna
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/webhook-endpoints/{endpointId}/deliveries/{deliveryId}/redeliver:
    post:
      operationId: redeliverWebhook
      tags: [integrations]
      summary: Rimette in coda una consegna (fallita o già consegnata) per un nuovo invio
      description: >-
        Azzera failed_at/delivered_at/last_error e pianifica il tentativo subito (next_attempt_at = ora);
        il contatore attempts prosegue e il limite di 24 ore riparte da ora. Rifiutato con 409 se la
        consegna è già in attesa o l'endpoint è disattivato. Audit webhook.redelivered.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/WebhookEndpointID"
        - $ref: "#/components/parameters/WebhookDeliveryID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Consegna rimessa in coda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ---- M5A: map sea side (spec 11) -----------------------------------------------
  /api/admin/v1/establishments/{establishmentId}/maps/{mapId}/reorient:
    post:
      operationId: reorientMap
      tags: [maps]
      summary: Sposta il lato mare ribaltando o ruotando l'intera disposizione
      description: >-
        Cambia sea_side e trasforma la geometria (postazioni, decorazioni, tessere della passerella)
        così che ogni fila mantenga la sua distanza dal mare. Lati opposti: specchio parallelo alla
        riva (top↔bottom ribalta y, left↔right ribalta x; l'ordine lungo la riva resta invariato).
        Lati adiacenti: rotazione di 90° (orario o antiorario, quella che porta il vecchio lato mare sul
        nuovo) con scambio di width e height. Solo geometria: id, etichette, file, zone e allocazioni
        invariati. Un unico salvataggio versionato (If-Match obbligatorio, versione +1, evento
        config.map_changed con change "reoriented"). Se esistono allocazioni future sulle postazioni
        della mappa serve acknowledge_future_allocations=true, altrimenti 409
        spot_has_future_allocations con spot_ids. dry_run=true restituisce l'anteprima senza salvare
        (nessun 409, solo i conteggi). Permesso establishment.configure.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/MapID"
        - $ref: "#/components/parameters/IfMatchRequired"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapReorientRequest"
      responses:
        "200":
          description: Mappa riorientata (o anteprima con dry_run)
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapReorientResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ---- M6/M7: meta, devices, device API, fiscal bridge, desktop --------------

  /api/admin/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Versione, edizione e capacità dell'istanza
      description: >-
        Spec 29.1 e 29.2. Non richiede autenticazione: l'app mobile e l'app desktop lo leggono prima
        dell'abbinamento per verificare la compatibilità (versione minima) e la modalità dell'istanza. Non
        contiene dati dello stabilimento né dati personali. Il pannello lo usa per rilevare l'edizione desktop
        (pagina pubblica e pagamenti online disattivati).
      security: []
      responses:
        "200":
          description: Metadati dell'istanza
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"

  /api/admin/v1/system/update:
    get:
      operationId: getSystemUpdate
      tags: [meta]
      summary: Avviso di nuova versione di Arenile
      description: >-
        ADR 0025. Restituisce la versione in esecuzione e, se il controllo degli aggiornamenti è attivo
        (`ARENILE_UPDATE_CHECK`, default vero; nell'edizione desktop l'impostazione `update_check`), l'ultima
        versione pubblicata letta dal processo in background una volta al giorno. Non fa chiamate di rete
        durante la richiesta: risponde dalla copia in memoria. Leggibile dai titolari e dai gestori (permesso
        `establishment.configure` su almeno uno stabilimento); le chiavi API non hanno accesso. Le versioni di
        sviluppo (`dev`, `-dev.`) non controllano mai.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Stato degli aggiornamenti
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/system/update/check:
    post:
      operationId: checkSystemUpdate
      tags: [meta]
      summary: Verifica subito se c'è una nuova versione di Arenile
      description: >-
        ADR 0025. Esegue subito il controllo degli aggiornamenti ("Verifica aggiornamenti") e restituisce lo
        stato aggiornato, come `getSystemUpdate`. Il server limita i controlli: se ne è già avvenuto uno (automatico
        o manuale) nell'ultimo minuto, o uno è in corso, risponde con lo stato in memoria senza chiamate di rete.
        Con il controllo spento (`ARENILE_UPDATE_CHECK=false`, impostazione `update_check` dell'app desktop) o
        con una versione di sviluppo non fa chiamate di rete e risponde `status: disabled`. Un controllo non
        riuscito non è un errore: risponde `200` con `status: unavailable`. Solo titolari e gestori (permesso
        `establishment.configure` su almeno uno stabilimento); le chiavi API non hanno accesso.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Stato degli aggiornamenti dopo il controllo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUpdate"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/admin/v1/establishments/{establishmentId}/devices/pairing-codes:
    post:
      operationId: createDevicePairingCode
      tags: [devices]
      summary: Crea un codice di abbinamento monouso a breve scadenza (QR)
      description: >-
        Spec 29.2. Il codice (e il QR che lo contiene) si scambia una sola volta con un token per dispositivo
        tramite `pairDevice`, entro `expires_at` (default 5 minuti). Il token avrà i permessi del ruolo
        dell'utente (`user_id`, default l'utente corrente) limitati a questo stabilimento. Creare un codice
        per un altro utente richiede `users.manage`. Nell'edizione desktop senza modalità rete locale
        risponde `409 lan_mode_required` (nessun indirizzo raggiungibile dagli altri dispositivi). Il codice
        è restituito solo in questa risposta e conservato come hash; per questo l'operazione non accetta
        `Idempotency-Key`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePairingCodeRequest"
      responses:
        "201":
          description: Codice creato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairingCode"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/admin/v1/establishments/{establishmentId}/devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: Dispositivi abbinati allo stabilimento
      description: >-
        Spec 29.2. Con `users.manage` elenca tutti i dispositivi dello stabilimento, altrimenti solo quelli
        dell'utente corrente. I revocati sono esclusi salvo `include_revoked=true`. Ordine: ultimo utilizzo
        decrescente.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: include_revoked
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Pagina di dispositivi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/admin/v1/establishments/{establishmentId}/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [devices]
      summary: Revoca un dispositivo (il suo token smette subito di funzionare)
      description: >-
        Spec 29.2. Ogni utente può revocare i propri dispositivi; quelli degli altri richiedono
        `users.manage`. Idempotente: revocare un dispositivo già revocato risponde 204. Se il dispositivo era il
        ponte fiscale dello stabilimento, la registrazione del ponte viene disattivata nella stessa
        transazione. Audit `device.revoked`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Revocato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/admin/v1/establishments/{establishmentId}/fiscal-bridge:
    get:
      operationId: getFiscalBridgeStatus
      tags: [fiscal-bridge]
      summary: Stato del ponte fiscale dello stabilimento
      description: >-
        Spec 29.1. Dispositivo registrato come ponte, ultimo contatto (online se entro 60 secondi), stato del
        registratore riportato dal dispositivo, documenti in coda e falliti. Permesso `reports.read` o
        `cash.operate`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
      responses:
        "200":
          description: Stato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalBridgeStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/device/v1/pair:
    post:
      operationId: pairDevice
      tags: [device]
      summary: Scambia un codice di abbinamento con un token per dispositivo
      description: >-
        Spec 29.2. Non autenticato, limitato per IP (10 tentativi al minuto). Il codice è monouso: lo scambio
        lo consuma con un UPDATE condizionale, quindi due richieste concorrenti con lo stesso codice producono
        un solo token. Codice inesistente, scaduto o già usato rispondono tutti `400 pairing_code_invalid`
        (nessun oracolo). Il token (`ar_dev_<prefix>_<secret>`) è restituito solo qui; il server conserva
        lo SHA-256. Si usa poi come `Authorization: Bearer` sulle API admin (permessi del ruolo dell'utente
        nello stabilimento del codice) e sulle API `/api/device/v1`. Nessun cookie, quindi nessun CSRF.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePairRequest"
      responses:
        "201":
          description: Dispositivo abbinato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/device/v1/demo-pairing:
    post:
      operationId: createDemoPairingCode
      tags: [device]
      summary: Codice di abbinamento allo stabilimento dimostrativo
      description: >-
        Spec 29.2. Solo sulle istanze dimostrative (`ARENILE_DEMO_PAIRING_USER` e
        `ARENILE_DEMO_PAIRING_ESTABLISHMENT`, spec 24.4); sulle altre risponde `404`. Non autenticato, limitato
        per rete del client (5 richieste all'ora; la /64 per IPv6) e in totale (300 all'ora). Restituisce un
        codice di abbinamento nuovo per l'utente dimostrativo
        configurato, valido 5 minuti: il pulsante "Prova la demo" dell'app lo scambia subito con
        `POST /api/device/v1/pair`. Il dispositivo abbinato ha il ruolo di quell'utente, ammesso solo se è
        `cashier`, `beach_staff` o `viewer` (con un titolare o un gestore l'endpoint risponde `404`). Nessun corpo.
      security: []
      responses:
        "201":
          description: Codice creato
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairingCode"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/device/v1/self:
    get:
      operationId: getCurrentDevice
      tags: [device]
      summary: Il dispositivo del token (verifica che il token sia ancora valido)
      security:
        - deviceAuth: []
      responses:
        "200":
          description: Dispositivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
