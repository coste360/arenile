  /api/admin/v1/establishments/{establishmentId}/setup/reset:
    post:
      operationId: resetEstablishmentSetup
      tags:
        - setup
      summary: Ricomincia la configurazione o azzera lo stabilimento
      description: >-
        Solo il titolare (permessi `establishment.configure`, `users.manage` e `payments.configure`), con una
        sessione utente (non chiavi API né dispositivi). `confirm_name` deve essere il nome dello stabilimento.
        `scope: configuration` cancella stagioni e periodi, chiusure, mappe, postazioni, zone, pool, catalogo,
        prezzi, codici sconto, convenzioni, policy e biglietti d'ingresso, e riapre la configurazione guidata; è
        rifiutato con `409` se lo stabilimento ha dati operativi (`SetupStatus.has_operations`). `scope:
        everything` cancella anche prenotazioni, abbonamenti, clienti, incassi, sessioni di cassa, biglietti,
        documenti fiscali, crediti, lista d'attesa e rinnovi; è rifiutato con `409` finché un pagamento online o un
        rimborso è in corso presso il provider. Entrambi spengono `booking_enabled` e scrivono gli eventi
        `config.map_changed` e `config.pricing_changed`. Restano sempre il profilo dello stabilimento, i contatori dei
        biglietti del giorno,
        gli utenti, i pagamenti online, le email, i dispositivi, le casse e le stampanti, il registro attività.
        Irreversibile; tutto in una transazione, con una voce `setup.reset` nel registro attività.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupResetRequest"
      responses:
        "200":
          description: Stabilimento azzerato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupResetResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
