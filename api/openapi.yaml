        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: unpairCurrentDevice
      tags: [device]
      summary: Scollega questo dispositivo (revoca il proprio token)
      security:
        - deviceAuth: []
      responses:
        "204":
          description: Revocato
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/device/v1/fiscal-bridge:
    put:
      operationId: registerFiscalBridge
      tags: [fiscal-bridge]
      summary: Registra (o aggiorna) questo dispositivo come ponte fiscale dello stabilimento
      description: >-
        Spec 29.1 e 14.2. Chiamato dall'app desktop in modalità remota all'avvio e a ogni cambio di stato del
        registratore. Un solo ponte attivo per stabilimento: la registrazione di un nuovo dispositivo
        disattiva la precedente (audit `fiscal_bridge.registered`). Il dispositivo deve appartenere a un
        utente con `cash.operate`. Per emettere i documenti tramite il ponte lo stabilimento usa il driver
        fiscale `bridge` (`settings.fiscal.driver`).
      security:
        - deviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiscalBridgeRegistration"
      responses:
        "200":
          description: Registrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalBridgeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: unregisterFiscalBridge
      tags: [fiscal-bridge]
      summary: Annulla la registrazione di questo dispositivo come ponte fiscale
      description: I lavori non ancora completati restano in coda per il prossimo ponte registrato.
      security:
        - deviceAuth: []
      responses:
        "204":
          description: Registrazione annullata (idempotente)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/device/v1/fiscal-bridge/jobs:
    get:
      operationId: pollFiscalBridgeJobs
      tags: [fiscal-bridge]
      summary: Attende i lavori fiscali da eseguire sul FiscalDriver locale (long polling)
      description: >-
        Connessione in uscita dal dispositivo verso l'istanza: nessuna porta in ingresso sul PC della cassa.
        La risposta arriva appena c'è almeno un lavoro, oppure dopo `wait` secondi con `jobs` vuoto. I lavori
        restituiti sono assegnati in esclusiva a questo dispositivo fino a `lease_expires_at`: se il risultato
        non arriva entro la scadenza tornano in coda (consegna almeno una volta; il driver locale deduplica
        con `idempotency_key`). Ogni chiamata aggiorna l'ultimo contatto del ponte. Solo il dispositivo
        registrato come ponte attivo riceve lavori; gli altri ricevono `409 conflict`.
      security:
        - deviceAuth: []
      parameters:
        - name: wait
          in: query
          required: false
          description: Secondi di attesa massima (default 25).
          schema:
            type: integer
            minimum: 0
            maximum: 25
            default: 25
        - name: max
          in: query
          required: false
          description: Numero massimo di lavori (default 10).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Lavori assegnati (eventualmente nessuno)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalBridgeJobBatch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/device/v1/fiscal-bridge/jobs/{jobId}/result:
    post:
      operationId: submitFiscalBridgeJobResult
      tags: [fiscal-bridge]
      summary: Esito di un lavoro fiscale eseguito sul FiscalDriver locale
      description: >-
        Idempotente: lo stesso esito inviato di nuovo risponde 204. Un esito per un lavoro non più assegnato a
        questo dispositivo (lease scaduto e riassegnato) o già chiuso con un esito diverso risponde
        `409 conflict`. Con `outcome=failed` e `retryable=true` il lavoro torna in coda con backoff fino a 5
        tentativi; altrimenti il documento fiscale passa a `failed`.
      security:
        - deviceAuth: []
      parameters:
        - $ref: "#/components/parameters/FiscalBridgeJobID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiscalBridgeJobResult"
      responses:
        "204":
          description: Esito registrato
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /api/desktop/v1/first-run:
