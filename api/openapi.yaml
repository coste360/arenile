        extras:
          type: array
          items:
            $ref: "#/components/schemas/ExtraBreakdown"
        discounts:
          type: array
          items:
            $ref: "#/components/schemas/DiscountBreakdown"
        rounding:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        vat:
          type: array
          items:
            $ref: "#/components/schemas/VatBreakdown"
    PolicyViolation:
