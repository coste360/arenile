      type: string
      description: Stato di una postazione nella vista operativa (spec 11.3).
      enum: [free, booked, checked_in, pass_holder, released, held, renewal_offer, blocked, closed, inactive]
    OperationalBooking:
      type: object
      required: [booking_id, code, status, channel, customer_id, customer_display_name, occupant_label, customer_anonymized, customer_tags, starts_on, ends_on, slots, is_season_pass, pack_codes, total_amount, paid_amount, balance_due, has_notes, has_extras, version]
      properties:
        booking_id:
          type: string
          format: uuid
          x-go-type: string
