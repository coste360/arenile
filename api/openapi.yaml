    # ---- ESC/POS network printers and print jobs (00011, ADR 0021) ----
    PrinterDriver:
      type: string
      enum: [network]
      description: >-
        Come arrivano i byte alla stampante. v1: solo network (TCP raw, porta 9100, edizione desktop).
        Ponti futuri (app desktop per il VPS, app mobile Bluetooth) aggiungeranno valori qui.
    PrinterPaperWidth:
      type: integer
      enum: [58, 80]
      description: "Larghezza carta in mm."
    PrinterCodepage:
      type: string
      enum: [cp858, cp437, cp850, cp852, cp1252]
      description: "Codepage del testo; cp858 (default) ha € e le vocali accentate italiane."
    PrinterCutMode:
      type: string
      enum: [full, partial, none]
    PrinterStatus:
      type: string
      enum: [unknown, reachable, unreachable]
    PrinterUnavailableReason:
      type: string
      enum: [server_edition]
    Printer:
      type: object
      required: [id, name, driver, host, port, paper_width_mm, chars_per_line, codepage, cut_mode, feed_lines,
        print_logo, logo_cached, active, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
        driver:
          $ref: "#/components/schemas/PrinterDriver"
        host:
          type: string
          description: "IP o nome host della rete locale."
        port:
          type: integer
        paper_width_mm:
          $ref: "#/components/schemas/PrinterPaperWidth"
        chars_per_line:
          type: integer
          description: "Caratteri per riga del font A (default 32 su 58 mm, 48 su 80 mm)."
        codepage:
          $ref: "#/components/schemas/PrinterCodepage"
        codepage_table:
          type: integer
          description: "Numero della tabella ESC t se il modello non usa quello standard Epson."
        cut_mode:
          $ref: "#/components/schemas/PrinterCutMode"
        feed_lines:
          type: integer
          description: "Righe di avanzamento prima del taglio."
        print_logo:
          type: boolean
          description: "Stampa in testa il logo dello stabilimento (raster con dithering, in cache)."
        logo_cached:
          type: boolean
        drawer_pin:
          type: integer
          enum: [2, 5]
          description: "Pin del cassetto collegato alla stampante; assente = nessun cassetto."
        active:
          type: boolean
        status:
          $ref: "#/components/schemas/PrinterStatus"
        last_checked_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_error:
          type: string
          description: "Ultimo errore di rete (testo tecnico, senza dati personali)."
        version:
          $ref: "#/components/schemas/Version"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PrinterInput:
      type: object
      required: [name, host, paper_width_mm]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9100
        paper_width_mm:
          $ref: "#/components/schemas/PrinterPaperWidth"
        chars_per_line:
          type: integer
          minimum: 24
          maximum: 64
        codepage:
          $ref: "#/components/schemas/PrinterCodepage"
        codepage_table:
          type: integer
          minimum: 0
          maximum: 255
        cut_mode:
          $ref: "#/components/schemas/PrinterCutMode"
        feed_lines:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        print_logo:
          type: boolean
        drawer_pin:
          type: integer
          enum: [2, 5]
        active:
          type: boolean
    PrinterList:
      type: object
      required: [items, escpos_available]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Printer"
        escpos_available:
          type: boolean
          description: "true solo nell'edizione desktop."
        unavailable_reason:
          $ref: "#/components/schemas/PrinterUnavailableReason"
        tickets_available:
          type: boolean
          description: "true quando i biglietti della vendita giornaliera si possono stampare in ESC/POS (edizione desktop)."
    PrinterCheckResult:
      type: object
      required: [status, checked_at]
      properties:
        status:
          $ref: "#/components/schemas/PrinterStatus"
        latency_ms:
          type: integer
        error:
          type: string
        paper_low:
          type: boolean
          description: "Sensore carta quasi finita, se la stampante risponde a DLE EOT."
        cover_open:
          type: boolean
        checked_at:
          type: string
          format: date-time
    PrintDocumentKind:
      type: string
      enum: [daily_ticket, cash_z, payment_receipt, test_page]
      description: >-
        daily_ticket = biglietto della vendita giornaliera (document_id = id del biglietto); cash_z = riepilogo
        della chiusura di cassa (document_id = id della sessione di cassa); payment_receipt = ricevuta non
        fiscale di un pagamento (document_id = id del pagamento); test_page = pagina di prova (nessun document_id).
    PrintRoute:
      type: object
      required: [document_kind, printer_id]
      properties:
        document_kind:
          $ref: "#/components/schemas/PrintDocumentKind"
        register_id:
          type: string
          format: uuid
          x-go-type: string
          description: "Cassa; assente = regola predefinita del documento."
        printer_id:
          type: string
          format: uuid
          x-go-type: string
        copies:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
        kick_drawer:
          type: boolean
          description: "Apre il cassetto della stampante (se ha drawer_pin) dopo la stampa di un pagamento in contanti."
    PrintRouteSet:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PrintRoute"
    PrintRouteUnreadyReason:
      type: string
      enum: [server_edition, no_route, printer_inactive, printer_unreachable]
    PrintRouteResolution:
      type: object
      required: [document_kind, ready, copies, kick_drawer]
      properties:
        document_kind:
          $ref: "#/components/schemas/PrintDocumentKind"
        ready:
          type: boolean
        reason:
          $ref: "#/components/schemas/PrintRouteUnreadyReason"
        printer:
          $ref: "#/components/schemas/Printer"
        copies:
          type: integer
        kick_drawer:
          type: boolean
    PrintJobStatus:
      type: string
      enum: [queued, printing, printed, failed, cancelled]
    PrintJobInput:
      type: object
      required: [document_kind]
      properties:
        document_kind:
          $ref: "#/components/schemas/PrintDocumentKind"
        document_id:
          type: string
          format: uuid
          x-go-type: string
          description: "Obbligatorio tranne che per test_page."
        register_id:
          type: string
          format: uuid
          x-go-type: string
          description: "Cassa da cui si stampa (sceglie la regola di instradamento)."
        printer_id:
          type: string
          format: uuid
          x-go-type: string
          description: "Stampante esplicita; ignora l'instradamento."
        copies:
          type: integer
          minimum: 1
          maximum: 3
        kick_drawer:
          type: boolean
    PrintJob:
      type: object
      required: [id, document_kind, status, attempts, max_attempts, copies, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        printer_id:
          type: string
          format: uuid
          x-go-type: string
          description: "Assente se la stampante è stata eliminata."
        printer_name:
          type: string
        document_kind:
          $ref: "#/components/schemas/PrintDocumentKind"
        document_id:
          type: string
          format: uuid
          x-go-type: string
        register_id:
          type: string
          format: uuid
          x-go-type: string
        status:
          $ref: "#/components/schemas/PrintJobStatus"
        attempts:
          type: integer
        max_attempts:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        last_error:
          type: string
        copies:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        printed_at:
          type: string
          format: date-time
    PrintJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PrintJob"
        next_cursor:
          type: string
