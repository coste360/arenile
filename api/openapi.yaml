        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/payments/reconciliation:
    get:
      operationId: getReconciliationReport
      tags: [payments]
      summary: Riconciliazione dei pagamenti online
      description: >-
        Spec 13.3. Pagamenti presso il provider confrontati con il registro: pendenti da più di 10 minuti, esito
        del provider diverso da quello locale, incassi senza riga nel registro, importi diversi.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - name: from
