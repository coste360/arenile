  /api/public/v1/{slug}/quote:
    post:
      operationId: quotePublicBooking
      tags: [public]
      summary: Prezzo e policy di una selezione (nessuna scrittura)
      description: >-
        Chiamata dal riepilogo sempre visibile con debounce (spec 12.3 passo 3). Canale `online`: policy online,
        quota online, pack ed extra con canale online. Un codice promozionale non valido non è un errore:
        `promo.status = invalid`. Conta come lettura per i limiti (60/min per IP).
      security: []
