        allowed_formulas:
          type: array
          items:
            $ref: "#/components/schemas/Formula"
        max_per_booking:
          type: integer
        requires_approval:
          type: boolean
        from_price:
          $ref: "#/components/schemas/Money"
    PublicExtra:
      type: object
