components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: arenile_session
      description: Sessione del pannello (cookie HttpOnly impostato dal login).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "ar_live_<prefix>_<secret>"
      description: Chiave API server-to-server legata a uno stabilimento.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursore opaco restituito come `next_cursor` dalla pagina precedente.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Numero massimo di elementi (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Chiave di idempotenza scelta dal client (consigliato un UUID). Una
        richiesta ripetuta con la stessa chiave restituisce la risposta
        originale; con un corpo diverso risponde `422 idempotency_key_reused`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Obbligatorio per le richieste autenticate via cookie che modificano
        dati: deve coincidere con il valore del cookie `arenile_csrf`.
      schema:
        type: string
    EstablishmentID:
      name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        ETag (versione) letto in precedenza: se non coincide la richiesta fallisce con 412 version_conflict.
        `*` equivale a "qualsiasi versione". È accettata anche la forma debole `W/"3"` prodotta dai proxy
        che comprimono le risposte (ADR 0008).
      schema:
        type: string
        maxLength: 64
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: >-
        ETag (versione) della mappa letta in precedenza; obbligatorio (428 precondition_required se
        assente). `*` salva sulla versione corrente; la forma debole `W/"3"` è accettata (ADR 0008).
      schema:
        type: string
        maxLength: 64
    MapID:
      name: mapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    TeamUserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    SeasonID:
      name: seasonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    RatePeriodID:
      name: ratePeriodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    ClosureDayID:
      name: closureDayId
