        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"
    delete:
      operationId: deletePrinter
      tags: [printing]
      summary: "Elimina la stampante"
      description: >-
        Permesso establishment.configure. Elimina anche i suoi instradamenti; i lavori di stampa restano nello
        storico senza stampante (quelli in coda passano a cancelled).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/PrinterID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: "Eliminata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/printers/{printerId}/check:
    post:
      operationId: checkPrinter
      tags: [printing]
      summary: "Verifica se la stampante è raggiungibile"
      description: >-
        Permesso cash.operate. Apre una connessione TCP verso host:porta (timeout 3 s), chiede lo stato
        (DLE EOT) se la stampante risponde, aggiorna status, last_checked_at e last_error della stampante.
        Non stampa nulla. Edizione server → 409 printing_unavailable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/PrinterID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterCheckResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/printers/{printerId}/test-print:
    post:
      operationId: testPrinter
      tags: [printing]
      summary: "Stampa di prova"
      description: >-
        Permesso cash.operate. Accoda un lavoro test_page (nome stabilimento, logo se attivo, stampante,
        larghezza, codepage con caratteri accentati e €, righe a due colonne, QR, taglio) verso questa
        stampante, ignorando l'instradamento. Risponde 202 con il lavoro; l'esito si legge con getPrintJob.
        Edizione server → 409 printing_unavailable; stampante disattivata → 409 conflict.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/PrinterID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: "Accodato"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/print-routes:
    get:
      operationId: getPrintRoutes
      tags: [printing]
      summary: "Instradamento dei documenti verso le stampanti"
      description: >-
        Permesso cash.operate. Una riga per (tipo documento, cassa); `register_id` assente = regola
        predefinita per quel documento, usata dalle casse senza una regola propria. L'ETag copre l'intero
        insieme.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
      responses:
        "200":
          description: "OK"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintRouteSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      operationId: updatePrintRoutes
      tags: [printing]
      summary: "Sostituisci l'instradamento dei documenti"
      description: >-
        Permesso establishment.configure. Sostituisce l'intero insieme in una transazione. Al massimo una
        riga per (document_kind, register_id) (400 validation_failed altrimenti); stampante o cassa di un
        altro stabilimento → 404.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintRouteSet"
      responses:
        "200":
          description: "OK"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintRouteSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/print-routes/resolve:
    get:
      operationId: resolvePrintRoute
      tags: [printing]
      summary: "Stampante da usare per un documento"
      description: >-
        Permesso cash.operate. Usato dai pulsanti di stampa (cassa, chiusura Z, ricevuta, biglietto): regola
        della cassa, altrimenti regola predefinita. `ready` è true solo se l'edizione è desktop e la stampante
        instradata è attiva e non risulta irraggiungibile; altrimenti `reason` spiega perché e il client usa la
        stampa del browser.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - name: document_kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PrintDocumentKind"
        - name: register_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintRouteResolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/print-jobs:
    get:
      operationId: listPrintJobs
      tags: [printing]
      summary: "Lavori di stampa recenti"
      description: "Permesso cash.operate. Dal più recente; nessun dato personale (solo tipo, riferimento, esito)."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PrintJobStatus"
        - name: printer_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJobList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createPrintJob
      tags: [printing]
      summary: "Stampa un documento su stampante ESC/POS"
      description: >-
        Permesso cash.operate. Il server compone il documento (ricevuta di pagamento non fiscale, riepilogo
        chiusura Z, biglietto della vendita giornaliera, pagina di prova) e lo accoda verso la stampante
        indicata o instradata. Con l'header Idempotency-Key una richiesta ripetuta (doppio clic, rete lenta)
        restituisce lo stesso lavoro (200); la stessa chiave per un altro documento, tipo o stampante →
        422 idempotency_key_reused. Senza header ogni richiesta è un nuovo lavoro (ristampa voluta). La consegna
        è "almeno una volta": un lavoro il cui lease scade a metà invio viene rispedito (senza riaprire il
        cassetto). Edizione server → 409 printing_unavailable; nessuna regola né printer_id →
        409 print_route_missing; documento inesistente → 404; daily_ticket senza sorgente dei biglietti → 400.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrintJobInput"
      responses:
        "200":
          description: "Lavoro già esistente con la stessa chiave di idempotenza"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "202":
          description: "Accodato"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/print-jobs/{printJobId}:
    get:
      operationId: getPrintJob
      tags: [printing]
      summary: "Stato del lavoro di stampa"
      description: "Permesso cash.operate."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/PrintJobID"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/print-jobs/{printJobId}/retry:
    post:
      operationId: retryPrintJob
      tags: [printing]
      summary: "Riprova un lavoro di stampa fallito"
      description: >-
        Permesso cash.operate. Solo da failed: torna queued con tentativi azzerati e lo stesso contenuto.
        Altri stati → 409 invalid_transition. Edizione server → 409 printing_unavailable.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/PrintJobID"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: "Riaccodato"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "501":
          $ref: "#/components/responses/NotImplemented"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: arenile_session
      description: Sessione del pannello (cookie HttpOnly impostato dal login).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "ar_live_<prefix>_<secret>"
      description: >-
        Chiave API server-to-server legata a uno stabilimento (`ar_live_...`), oppure token per dispositivo
        (`ar_dev_...`, vedi `deviceAuth`) con i permessi del ruolo del suo utente.
    deviceAuth:
      type: http
      scheme: bearer
      bearerFormat: "ar_dev_<prefix>_<secret>"
      description: >-
        Token per dispositivo ottenuto con `pairDevice` (app mobile, app desktop in modalità remota). Vale anche
        come `bearerAuth` sulle API admin, con i permessi del ruolo dell'utente nello stabilimento del
        dispositivo. Revocabile dal pannello (spec 29.2).

  parameters:
    # ---- deferred features (00009) ----
    RefundRequestID:
      name: refundRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    CashRegisterID:
      name: registerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    NotificationID:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    ImportJobID:
      name: importId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    PreviewToken:
      name: X-Arenile-Preview
      in: header
      required: false
      description: >-
        Token del link di anteprima (createTestModePreviewLink) inoltrato dalla pagina pubblica. Con la
        modalità prova attiva e public_enabled=false, senza un token valido le creazioni rispondono 403
        test_mode_preview_required. Letto da tutte le operazioni pubbliche (dichiarato dove decide).
      schema:
        type: string
        maxLength: 512
    RenewalCampaignID:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    RenewalProposalID:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    WaitlistEntryID:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    WaitlistOfferID:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    WaitlistToken:
      name: waitlistToken
      in: path
      required: true
      description: Token del link personale della lista d'attesa (256 bit, base64url).
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{32,128}$
    DeviceID:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    FiscalBridgeJobID:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    BackupName:
      name: backupName
      in: path
      required: true
      description: Nome del file di backup come restituito da `listDesktopBackups` (nessun percorso).
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    TicketID:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    EntryTicketTypeID:
      name: entryTicketTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    BookingCode:
      name: bookingCode
      in: path
      required: true
      description: Codice della prenotazione (contenuto del QR del biglietto).
      schema:
        type: string
        minLength: 1
        maxLength: 40
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursore opaco restituito come `next_cursor` dalla pagina precedente.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Numero massimo di elementi (default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Chiave di idempotenza scelta dal client (consigliato un UUID). Una
        richiesta ripetuta con la stessa chiave restituisce la risposta
        originale; con un corpo diverso risponde `422 idempotency_key_reused`.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: |
        Obbligatorio per le richieste autenticate via cookie che modificano
        dati: deve coincidere con il valore del cookie `arenile_csrf`.
      schema:
        type: string
    EstablishmentID:
      name: establishmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    CheckoutToken:
      name: X-Arenile-Checkout
      in: header
      required: true
      description: >-
        Token della sessione di checkout restituito da createPublicBooking (salvato dal client in
        sessionStorage, spec 12.2). Mai in un cookie o nella URL.
      schema:
        type: string
        minLength: 32
        maxLength: 128
    ManageToken:
      name: token
      in: path
      required: true
      description: Token del link magico (256 bit, base64url).
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{32,128}$
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag letto in precedenza; se coincide la risposta è 304.
      schema:
        type: string
        maxLength: 128
    QrFormat:
      name: format
      in: query
      required: false
      description: Formato dell'immagine (default svg).
      schema:
        type: string
        enum: [svg, png]
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        ETag (versione) letto in precedenza: se non coincide la richiesta fallisce con 412 version_conflict.
        `*` equivale a "qualsiasi versione". È accettata anche la forma debole `W/"3"` prodotta dai proxy
        che comprimono le risposte (ADR 0008).
      schema:
        type: string
        maxLength: 64
    EmailTemplateKindParam:
      name: kind
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EmailTemplateKind"
    EmailLocaleParam:
      name: locale
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EmailLocale"
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      description: >-
        ETag (versione) della mappa letta in precedenza; obbligatorio (428 precondition_required se
        assente). `*` salva sulla versione corrente; la forma debole `W/"3"` è accettata (ADR 0008).
      schema:
        type: string
        maxLength: 64
    MapID:
      name: mapId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    TeamUserID:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    SeasonID:
