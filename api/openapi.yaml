        base:
          $ref: "#/components/schemas/Money"
        applied:
          type: array
          items:
            $ref: "#/components/schemas/AppliedRule"
        total:
          $ref: "#/components/schemas/Money"
    ExtraBreakdown:
      type: object
      required:
        - code
        - qty
        - total
      properties:
        code:
          type: string
        qty:
          type: integer
        total:
          $ref: "#/components/schemas/Money"
    FixedBreakdown:
