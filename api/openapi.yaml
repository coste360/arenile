        type: string
        format: uuid
        x-go-type: string

  responses:
    BadRequest:
      description: Richiesta non valida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Autenticazione assente o non valida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Permesso negato
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Risorsa inesistente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflitto con lo stato corrente
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Troppe richieste
      headers:
        Retry-After:
          description: Secondi da attendere
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    PreconditionFailed:
      description: Versione non aggiornata (version_conflict, con current_version)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: Header If-Match mancante (precondition_required)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Richiesta valida ma non elaborabile (no_price, policy_violation)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotImplemented:
      description: Operazione non ancora disponibile (not_implemented)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  headers:
    ETag:
      description: Versione della risorsa (`"<version>"`), da reinviare in If-Match.
      schema:
        type: string

  schemas:
    ProblemType:
      type: string
      description: |
        Slug stabile del tipo di errore. I client devono basarsi su questo
        valore, mai sul testo di `title` o `detail`.
      enum:
        - bad_request
        - validation_failed
        - unauthorized
        - invalid_credentials
        - totp_required
        - invalid_totp
        - totp_enrolment_required
        - totp_already_enabled
        - forbidden
        - csrf_failed
        - not_found
        - conflict
        - method_not_allowed
        - unsupported_media_type
        - rate_limited
        - idempotency_key_reused
        - idempotency_in_progress
        - internal_error
        - spot_unavailable
        - no_price
        - policy_violation
        - hold_expired
        - version_conflict
        - precondition_required
        - spot_has_future_allocations
        - not_implemented
    Problem:
      type: object
      description: Errore RFC 9457 (`application/problem+json`).
      required: [type, title, status]
      properties:
        type:
          $ref: "#/components/schemas/ProblemType"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        retry_after:
          type: integer
          description: Secondi da attendere (solo per `rate_limited`).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        current_version:
          type: integer
          format: int64
          description: Versione corrente della risorsa (solo per `version_conflict`).
        spot_ids:
          type: array
          description: Postazioni con allocazioni future (solo per `spot_has_future_allocations`).
          items:
            type: string
        violations:
          type: array
          description: Vincoli violati (solo per `policy_violation`).
          items:
            $ref: "#/components/schemas/PolicyViolation"
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          maxLength: 1024
        totp_code:
          type: string
          pattern: "^[0-9]{6}$"
    Role:
      type: string
      enum: [owner, manager, cashier, beach_staff, viewer]
    Permission:
      type: string
      enum:
        - establishment.configure
        - users.manage
        - payments.configure
        - bookings.write
        - cash.operate
        - refunds.issue
        - operations.run
        - bookings.read
        - reports.read
    User:
      type: object
      required: [id, email, name, locale, totp_enabled]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        email:
          type: string
        name:
          type: string
        locale:
          type: string
        totp_enabled:
          type: boolean
        last_login_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [organization_id, role, permissions]
      properties:
        organization_id:
          type: string
          format: uuid
          x-go-type: string
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
          description: Assente quando il ruolo vale per tutti gli stabilimenti dell'organizzazione.
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    Me:
      type: object
      required: [principal_type, memberships, totp_enrolment_required]
      properties:
        principal_type:
          type: string
          enum: [user, api_key]
        user:
          $ref: "#/components/schemas/User"
        api_key:
          $ref: "#/components/schemas/ApiKeyInfo"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        totp_enrolment_required:
          type: boolean
          description: |
            Vero quando l'installazione richiede il TOTP ai proprietari e
            l'utente non lo ha ancora attivato: finché resta vero sono
            consentite solo le operazioni di autenticazione.
    ApiKeyInfo:
      type: object
      required: [id, name, prefix, establishment_id, scopes]
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        name:
          type: string
        prefix:
          type: string
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    TotpEnrollment:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Segreto base32 da inserire manualmente.
        otpauth_url:
          type: string
          description: URI `otpauth://` da mostrare come QR.
    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        province:
          type: string
        postal_code:
          type: string
        country:
          type: string
    Geo:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
    Theme:
      type: object
      description: Tema della pagina pubblica (specifica 12.5).
      properties:
        logo_url:
          type: string
        primary_color:
          type: string
        accent_color:
          type: string
        font_family:
          type: string
          enum: [Inter, system, serif]
        radius:
          type: string
          enum: [none, sm, md, lg]
        show_prices_on_map:
          type: boolean
        hide_header_in_embed:
          type: boolean
        custom_texts:
          type: object
          description: "Testi personalizzati per lingua, es. {\"it\": {\"intro\": \"...\"}}."
          additionalProperties:
            type: object
            additionalProperties:
              type: string
    Establishment:
      type: object
      required:
        - id
        - organization_id
        - slug
        - name
        - timezone
        - currency
        - default_locale
        - enabled_locales
        - contact_email
        - contact_phone
        - address
        - booking_enabled
        - allowed_embed_origins
        - theme
        - settings
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        organization_id:
          type: string
          format: uuid
          x-go-type: string
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        default_locale:
          type: string
        enabled_locales:
          type: array
          items:
            type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        geo:
          $ref: "#/components/schemas/Geo"
        concession_ref:
          type: string
        booking_enabled:
          type: boolean
        allowed_embed_origins:
          type: array
          items:
            type: string
        theme:
          $ref: "#/components/schemas/Theme"
        settings:
          $ref: "#/components/schemas/EstablishmentSettings"
        version:
          $ref: "#/components/schemas/Version"
        archived_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EstablishmentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Establishment"
        next_cursor:
          type: string
          description: Presente se esistono altri elementi.
    PublicEstablishment:
      type: object
      required:
        - slug
        - name
        - timezone
        - currency
        - default_locale
        - enabled_locales
        - booking_enabled
        - theme
      properties:
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        default_locale:
          type: string
        enabled_locales:
          type: array
          items:
            type: string
        booking_enabled:
          type: boolean
        contact_email:
          type: string
        contact_phone:
          type: string
        address:
          $ref: "#/components/schemas/Address"
        theme:
          $ref: "#/components/schemas/Theme"
        season:
          $ref: "#/components/schemas/PublicSeason"
    PublicSeason:
      type: object
      description: Stagione attiva dello stabilimento (date prenotabili dalla pagina pubblica); assente quando nessuna stagione è attiva.
      required: [year, opens_on, closes_on]
      properties:
        year:
          type: integer
        opens_on:
          $ref: "#/components/schemas/Date"
        closes_on:
          $ref: "#/components/schemas/Date"
    StreamMessage:
      type: object
      description: Messaggio leggero inviato sul flusso SSE (specifica 21.1).
      required: [id, type, establishment_id, occurred_at]
      properties:
        id:
          type: string
        type:
          type: string
        establishment_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        spot_ids:
          type: array
          items:
            type: string
        dates:
          type: array
          items:
            type: string
            format: date
    I18nText:
      type: object
      description: "Testo localizzato lingua → testo (es. {\"it\": \"Prima fila\"}); si ricade sulla lingua predefinita."
      additionalProperties:
        type: string
        maxLength: 2000
    Money:
      type: integer
      format: int64
      description: Importo in centesimi di euro (IVA inclusa).
    Date:
      type: string
      format: date
      description: Data di calendario `YYYY-MM-DD` nel fuso dello stabilimento.
      x-go-type: calendar.Date
      x-go-type-import:
        path: github.com/coste360/arenile/internal/calendar
    MonthDay:
      type: string
      pattern: ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
      description: Ricorrenza annuale `MM-DD`.
    Decimal:
      type: string
      pattern: ^-?[0-9]{1,9}(\.[0-9]{1,6})?$
      description: Numero decimale esatto come stringa (es. "1.2", "0.5", "10"). Mai float nel calcolo.
    BasisPoints:
      type: integer
      format: int64
      minimum: 0
      maximum: 10000
      description: Aliquota in punti base (2200 = 22%).
    Version:
      type: integer
      format: int64
      minimum: 1
      description: Versione per la concorrenza ottimistica; coincide con l'ETag.
    Slot:
      type: string
      enum:
        - AM
        - PM
      description: "Fascia: mattina o pomeriggio."
    Slots:
      type: string
      enum:
        - AM
        - PM
        - FULL
      description: "Fasce prenotate: mattina, pomeriggio o giorno intero."
    Formula:
      type: string
      enum:
        - half_day
        - day
        - multi_day
        - week
        - fortnight
        - month
        - season
      description: Formula di durata.
    FixedFormula:
      type: string
      enum:
        - week
        - fortnight
        - month
        - season
      description: Formula a durata fissa.
    Channel:
      type: string
      enum:
        - desk
        - online
        - api
      description: Canale di vendita.
    SeasonStatus:
      type: string
      enum:
        - draft
        - active
        - closed
    AssignmentMode:
      type: string
      enum:
        - seat
        - zone
        - quantity
      description: Modalità di assegnazione della zona (spec 5.2).
    SpotKind:
      type: string
      enum:
        - umbrella
        - gazebo
        - tent
        - palm
        - custom
    DecorationKind:
      type: string
      enum:
        - walkway
        - shower
        - lifeguard
        - bar
        - entrance
        - cabin_block
        - text
        - custom
    SeaSide:
      type: string
      enum:
        - top
        - bottom
        - left
        - right
    PricingUnit:
      type: string
      enum:
        - per_booking
        - per_day
        - per_slot
    ExtraAttachTo:
      type: string
      enum:
        - line
        - booking
    PriceStage:
      type: string
      enum:
        - base
        - modifier
        - discount
    PriceTargetType:
      type: string
      enum:
        - pack
        - extra
    PriceActionType:
      type: string
      enum:
        - set
        - add
        - multiply
        - percent_off
        - amount_off
        - free_days
    AmountPer:
      type: string
      enum:
        - booking
        - line
        - day
    Rounding:
      type: string
      enum:
        - none
        - euro
        - fifty_cents
      description: Arrotondamento del totale finale.
    SetupTemplateCode:
      type: string
      enum:
        - classic_rows
        - quantity_beach
        - lido_with_pool
        - empty
      description: Modelli di spec 15.2.
    TeamScope:
      type: string
      enum:
        - establishment
        - organization
      description: Il ruolo vale per questo stabilimento o per tutta l'organizzazione.
    DateRange:
      type: object
      description: Intervallo inclusivo.
      required:
        - from
        - to
      properties:
        from:
          $ref: "#/components/schemas/Date"
        to:
          $ref: "#/components/schemas/Date"
    IntRange:
      type: object
      description: Intervallo intero inclusivo; un estremo assente è aperto.
      properties:
        min:
          type: integer
        max:
          type: integer
    Shape:
      type: object
      required:
        - type
        - w
        - h
      properties:
        type:
          type: string
          enum:
            - circle
            - rect
        w:
          type: number
          format: double
          minimum: 0
        h:
          type: number
          format: double
          minimum: 0
    ComponentQuantities:
      type: object
      description: "Quantità per codice componente (es. {\"umbrella\": 1, \"sunbed\": 2})."
      additionalProperties:
        type: integer
        minimum: 0
    OnlineQuota:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - percent
            - count
        value:
          type: integer
          minimum: 0
    CapacityOverride:
      type: object
      required:
        - from
        - to
        - capacity
      properties:
        from:
          $ref: "#/components/schemas/Date"
        to:
          $ref: "#/components/schemas/Date"
        capacity:
          type: integer
          minimum: 0
    MapBackground:
      type: object
      description: Sfondo opzionale della mappa (spec 11.2).
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - image
            - geojson
        url:
          type: string
          maxLength: 2048
          description: URL dell'immagine (type=image).
        geojson:
          type: object
          additionalProperties: true
          description: Perimetro GeoJSON (type=geojson).
        scale:
          type: number
          format: double
          exclusiveMinimum: 0
        rotation:
          type: number
          format: double
        offset_x:
          type: number
          format: double
        offset_y:
          type: number
          format: double
        opacity:
          type: number
          format: double
          minimum: 0
          maximum: 1
    PricingSettings:
      type: object
      description: Impostazioni dei prezzi dello stabilimento (spec 8.1, 8.5).
      required:
        - half_day_factor
        - rounding
        - default_vat_rate_bp
      properties:
        half_day_factor:
          $ref: "#/components/schemas/Decimal"
        rounding:
          $ref: "#/components/schemas/Rounding"
        default_vat_rate_bp:
          $ref: "#/components/schemas/BasisPoints"
        local_holidays:
          type: array
          items:
            $ref: "#/components/schemas/Date"
        recurring_local_holidays:
          type: array
          items:
            $ref: "#/components/schemas/MonthDay"
    EstablishmentSettings:
      type: object
      description: Impostazioni versionate. In scrittura sostituisce l'intero documento.
      required:
        - pricing
        - default_policy
      properties:
        pricing:
          $ref: "#/components/schemas/PricingSettings"
        default_policy:
          $ref: "#/components/schemas/PolicyRules"
    EstablishmentCreate:
      type: object
      required:
        - name
        - slug
      properties:
        organization_id:
          type: string
          format: uuid
          x-go-type: string
          description: Obbligatorio se l'utente è proprietario di più organizzazioni.
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        timezone:
          type: string
          maxLength: 64
          description: Default Europe/Rome.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Default EUR.
        default_locale:
          type: string
          maxLength: 8
          description: Default it.
        enabled_locales:
          type: array
          items:
            type: string
            maxLength: 8
        contact_email:
          type: string
          maxLength: 254
        contact_phone:
          type: string
          maxLength: 32
        address:
          $ref: "#/components/schemas/Address"
    EstablishmentUpdate:
      type: object
      description: "Aggiornamento parziale: solo i campi presenti vengono modificati."
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          pattern: ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
        timezone:
          type: string
          maxLength: 64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        default_locale:
          type: string
          maxLength: 8
        enabled_locales:
          type: array
          items:
            type: string
            maxLength: 8
        contact_email:
          type: string
          maxLength: 254
        contact_phone:
          type: string
          maxLength: 32
        address:
          $ref: "#/components/schemas/Address"
        geo:
          $ref: "#/components/schemas/Geo"
        concession_ref:
          type: string
          maxLength: 200
          description: Stringa vuota per rimuovere.
        booking_enabled:
          type: boolean
        allowed_embed_origins:
          type: array
          items:
            type: string
            maxLength: 255
        theme:
          $ref: "#/components/schemas/Theme"
        settings:
          $ref: "#/components/schemas/EstablishmentSettings"
        archived:
          type: boolean
          description: true archivia lo stabilimento, false lo ripristina.
    TeamMembership:
      type: object
      required:
        - id
        - organization_id
        - role
      properties:
        id:
          type: string
          format: uuid
          x-go-type: string
        organization_id:
          type: string
          format: uuid
          x-go-type: string
        establishment_id:
          type: string
          format: uuid
          x-go-type: string
          description: Assente per i ruoli validi su tutta l'organizzazione.
        role:
          $ref: "#/components/schemas/Role"
    TeamMember:
      type: object
      description: Utente con accesso allo stabilimento; role è il ruolo efficace qui.
      required:
        - user_id
        - email
        - name
        - locale
        - active
        - totp_enabled
        - role
        - scope
        - memberships
      properties:
        user_id:
          type: string
          format: uuid
          x-go-type: string
        email:
          type: string
        name:
          type: string
        locale:
          type: string
        active:
          type: boolean
        totp_enabled:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
        scope:
