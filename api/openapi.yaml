        pack_id:
          type: string
          format: uuid
          x-go-type: string
        zone_id:
          type: string
          format: uuid
          x-go-type: string
        spot_id:
          type: string
          format: uuid
          x-go-type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 50
