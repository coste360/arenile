      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
          description: Es. booking.created, booking.confirmed, booking.note_added, payment.succeeded.
        actor_type:
          type: string
          enum: [user, customer, system, api_key]
        actor_id:
          type: string
        actor_name:
          type: string
        details:
          type: object
          additionalProperties: true
    PolicySnapshot:
