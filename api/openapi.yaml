  # ---- M5A: reports (spec 15.3) ------------------------------------------------
  # Every report is a GET with from/to (inclusive calendar span, establishment
  # timezone, at most 400 days), JSON by default and CSV with format=csv or
  # Accept: text/csv (UTF-8 with BOM, ';' separator, decimal comma, Italian
  # headers, CRLF; same convention as the corrispettivi export). Permission
  # reports.read. Test bookings (spec 15.4) are excluded once that flag exists.
  /api/admin/v1/establishments/{establishmentId}/reports/summary:
    get:
      operationId: getReportSummary
      tags: [reports]
      summary: Indicatori principali del periodo (occupazione, ricavi, prenotazioni, saldi aperti)
      description: >-
        KPI del periodo per le schede del cruscotto dei report. Due sole basi di data, così le schede di uno
        stesso periodo non si contraddicono: base **soggiorno** per occupazione (giorno di soggiorno) e, per primo
        giorno di soggiorno (`starts_on`), prenotazioni, valore medio, prenotato, abbonamenti, cancellazioni e
        no-show; base **incasso** (`business_date` del pagamento, rimborsi negativi) per l'incassato. I report di
        dettaglio prenotazioni (data di vendita) e ricavi `basis=booked` (data di conferma) mantengono le loro
        basi. Permesso reports.read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - $ref: "#/components/parameters/ReportFormat"
      responses:
        "200":
          description: Indicatori
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/reports/occupancy:
    get:
      operationId: getOccupancyReport
      tags: [reports]
      summary: Occupazione per giorno, zona, fila o fascia
      description: >-
        Unità = (postazione, giorno, fascia AM/PM). Capacità = postazioni attive delle mappe dello
        stabilimento × giorni aperti (esclusi i giorni di chiusura e quelli fuori stagione) × 2 fasce,
        meno le unità bloccate (spot_blocks). Occupate = allocazioni booking e season, esclusi i giorni
        rilasciati dagli abbonati e non rivenduti (contati in released_units); gli hold non contano.
        occupancy_bp = occupied_units * 10000 / capacity_units (0 se capacità 0). Permesso reports.read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - name: group_by
          in: query
          required: false
          description: "Raggruppamento (default day)."
          schema:
            $ref: "#/components/schemas/OccupancyGroupBy"
        - name: zone_id
          in: query
          required: false
          description: "Limita a una zona."
          schema:
            type: string
            format: uuid
            x-go-type: string
        - name: map_id
          in: query
          required: false
          description: "Limita a una mappa."
          schema:
            type: string
            format: uuid
            x-go-type: string
        - $ref: "#/components/parameters/ReportFormat"
      responses:
        "200":
          description: Occupazione
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupancyReport"
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/reports/revenue:
    get:
      operationId: getRevenueReport
      tags: [reports]
      summary: Ricavi per periodo, canale, pack, extra, metodo di pagamento o aliquota IVA
      description: >-
        Due basi di calcolo. `collected` (incassato, default): pagamenti riusciti per business_date,
        rimborsi in negativo; IVA da payments.vat_breakdown; il canale è quello della prenotazione
        collegata (`counter` per le vendite al banco senza prenotazione). `booked` (venduto): valore
        delle prenotazioni confermate (confirmed, checked_in, completed, no_show) per giorno di conferma
        (confirmed_at nel fuso dello stabilimento), dallo snapshot del prezzo corrente. group_by
        payment_method richiede collected; pack ed extra richiedono booked (altrimenti 400
        validation_failed). Permesso reports.read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - name: group_by
          in: query
          required: false
          description: "Raggruppamento (default day)."
          schema:
            $ref: "#/components/schemas/RevenueGroupBy"
        - name: basis
          in: query
          required: false
          description: "Base di calcolo (default collected)."
          schema:
            $ref: "#/components/schemas/RevenueBasis"
        - $ref: "#/components/parameters/ReportFormat"
      responses:
        "200":
          description: Ricavi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueReport"
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/reports/bookings:
    get:
      operationId: getBookingsReport
      tags: [reports]
      summary: Prenotazioni per canale, anticipo di prenotazione, formula o giorno
      description: >-
        Prenotazioni vendute nel periodo (giorno di creazione nel fuso dello stabilimento), esclusi
        draft, held, expired e rejected. Anticipo (lead time) = starts_on − giorno di creazione, in
        fasce. Permesso reports.read.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/ReportFrom"
        - $ref: "#/components/parameters/ReportTo"
        - name: group_by
          in: query
          required: false
          description: "Raggruppamento (default channel)."
          schema:
            $ref: "#/components/schemas/BookingsReportGroupBy"
        - $ref: "#/components/parameters/ReportFormat"
      responses:
        "200":
          description: Prenotazioni
          content:
            application/json:
