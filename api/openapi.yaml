    PoolID:
      name: poolId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    ComponentID:
      name: componentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    PackID:
      name: packId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    ExtraID:
      name: extraId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        x-go-type: string
    PriceRuleID:
      name: priceRuleId
      in: path
