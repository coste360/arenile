  /webhooks/payments/{provider}/{establishmentId}:
    post:
      operationId: receivePaymentWebhook
      tags: [webhooks]
      summary: Webhook del provider di pagamento (firma obbligatoria)
      description: >-
        Spec 13.3, ADR 0006. Il corpo è letto grezzo (fino a 256 KB) e passato al driver con le credenziali
        decifrate dello stabilimento della URL: firma assente o errata → 400 `webhook_signature_invalid`. Ogni
        evento è registrato in `webhook_events` (deduplica per provider + id evento): un duplicato risponde 200
        senza effetti. Pagamento, prenotazione e allocazioni sono aggiornati in un'unica transazione; la conferma
        passa dal servizio prenotazioni (INV-19). Eventi non gestiti → 200. Nessun cookie, nessun CSRF, nessun
        limite per IP condiviso con l'API pubblica.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-z][a-z0-9_-]{1,31}$
        - $ref: "#/components/parameters/EstablishmentID"
      requestBody:
        required: true
        description: "Corpo grezzo del provider (Stripe: JSON firmato con l'header `Stripe-Signature`)."
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Evento ricevuto (elaborato, duplicato o ignorato)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

