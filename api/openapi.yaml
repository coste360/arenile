      required: [starts_on, ends_on, slots, formula, lines]
      properties:
        starts_on:
          $ref: "#/components/schemas/Date"
        ends_on:
          $ref: "#/components/schemas/Date"
        slots:
          $ref: "#/components/schemas/Slots"
        formula:
          $ref: "#/components/schemas/Formula"
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PublicLineInput"
        extras:
          type: array
          maxItems: 20
          description: Extra della prenotazione (attach_to = booking).
          items:
            $ref: "#/components/schemas/PublicExtraInput"
        promo_code:
          type: string
          maxLength: 40
    PublicBookingCreate:
      allOf:
        - $ref: "#/components/schemas/PublicSelection"
        - type: object
          properties:
            locale:
              type: string
              pattern: ^[a-z]{2}$
              description: Lingua del cliente per le comunicazioni.
    PublicQuoteItem:
      type: object
      required: [kind, label, amount]
      properties:
        kind:
          type: string
          enum: [line, extra, discount, rounding]
        ref_id:
          type: string
          format: uuid
          x-go-type: string
          description: Pack, extra o codice promozionale di riferimento.
        label:
          $ref: "#/components/schemas/I18nText"
        quantity:
          type: integer
        amount:
          $ref: "#/components/schemas/Money"
    PromoStatus:
      type: object
