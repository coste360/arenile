      description: >-
        Spec 10.4. Per ogni abbonamento confermato della stagione di origine (o solo `pass_ids`) crea una proposta
        con la stessa postazione e lo stesso pack, prezzo calcolato dal listino della stagione di destinazione, e una
        prenotazione `held` (`renewal_of_booking_id` = abbonamento di origine) con hold fino alla scadenza della
        prelazione: la postazione resta riservata dai vincoli del database (allocazioni) e in mappa appare come
        `renewal_offer`. Gli abbonamenti senza prezzo o con postazione non disponibile finiscono in `skipped`.
