  # ---- ESC/POS network printers and print jobs (00011, ADR 0021) ----
  /api/admin/v1/establishments/{establishmentId}/printers:
    get:
      operationId: listPrinters
      tags: [printing]
      summary: "Stampanti ESC/POS di rete dello stabilimento"
      description: >-
        Permesso cash.operate. `escpos_available` è true solo nell'edizione desktop (locale o rete locale:
        il server è nello stabilimento e raggiunge la stampante); sull'edizione server (VPS/Docker) è false con
        `unavailable_reason` server_edition, non si aggiungono stampanti e la stampa ripiega su quella del
        browser. `tickets_available` dice se i biglietti della vendita giornaliera si possono stampare
        in ESC/POS (edizione desktop): quando è false l'instradamento di daily_ticket non è offerto.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - name: include_inactive
          in: query
          required: false
          description: "Includi le stampanti disattivate."
          schema:
            type: boolean
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrinterList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "501":
          $ref: "#/components/responses/NotImplemented"
    post:
      operationId: createPrinter
      tags: [printing]
      summary: "Aggiungi una stampante di rete"
      description: >-
        Permesso establishment.configure, solo edizione desktop (edizione server → 409 printing_unavailable).
        `host` è un indirizzo IP privato o di rete locale (RFC 1918, 100.64/10, link-local, ULA IPv6) o un nome
        che si risolve solo in tali indirizzi; loopback solo con `ARENILE_PRINTERS_ALLOW_LOOPBACK` (sviluppo
        e test), mai gli indirizzi dei metadati cloud; altrimenti 422 printer_address_not_allowed. Nome già
        usato → 409 conflict.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrinterInput"
      responses:
        "201":
          description: "OK"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Printer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/admin/v1/establishments/{establishmentId}/printers/{printerId}:
    get:
      operationId: getPrinter
      tags: [printing]
      summary: "Dettaglio della stampante"
      description: "Permesso cash.operate."
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/EstablishmentID"
        - $ref: "#/components/parameters/PrinterID"
      responses:
