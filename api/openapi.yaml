          type: string
          format: uuid
          x-go-type: string
        description:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
        test:
          type: boolean
          description: "Incassato in modalità prova (spec 15.4): escluso da report, KPI, corrispettivi ed esportazioni."
    PaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        next_cursor:
          type: string
    ManualPaymentInput:
      type: object
      required: [amount, method]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Centesimi.
        method:
          $ref: "#/components/schemas/PaymentMethod"
        cash_session_id:
          type: string
          format: uuid
          x-go-type: string
          description: Default la sessione aperta della cassa main (obbligatoria per i contanti).
        note:
          type: string
          maxLength: 500
        overpayment_as_credit:
          type: boolean
          description: >-
            Accetta un importo superiore al saldo dovuto: l'eccedenza viene accreditata subito al cliente
            (spec 13.4, movimento di `customer_credits`). Senza, un importo oltre il saldo è 400 validation_failed.
    RefundInput:
      type: object
      required: [amount, method]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
        method:
          $ref: "#/components/schemas/PaymentMethod"
        payment_id:
          type: string
          format: uuid
          x-go-type: string
          description: Pagamento rimborsato (facoltativo).
        as:
          type: string
          enum: [refund, credit]
          description: refund (default) restituisce il denaro; credit lo accredita al cliente.
        via_provider:
          type: boolean
          description: >-
            Rimborso tramite il provider del pagamento `payment_id` (es. Stripe, spec 13.4): obbligatorio
            payment_id di un pagamento online; il rimborso resta `pending` fino alla conferma del provider
            (webhook `charge.refunded` o riconciliazione). Senza supporto del provider → 409 `conflict`.
        reason:
          type: string
          maxLength: 500
        cash_session_id:
          type: string
          format: uuid
          x-go-type: string
    CounterSaleInput:
      type: object
      required: [amount, method, description]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
        method:
