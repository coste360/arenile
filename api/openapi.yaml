          description: Stabilimento
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEstablishment"
        "304":
          description: Non modificato
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/public/v1/{slug}/calendar:
    get:
      operationId: getPublicCalendar
      tags: [public]
      summary: Disponibilità sintetica per giorno di un mese (passo "Quando")
      description: >-
        Spec 12.3 passo 1. Per ogni giorno del mese: disponibile, ultimi posti, pieno, chiuso o non prenotabile
        (fuori stagione o fuori dai limiti della policy online). La disponibilità considera il canale `online`
        e la quota online (spec 7.6). I periodi tariffari sono inclusi solo se il gestore abilita
        `flow.show_rate_periods`. Cache breve (`Cache-Control: public, max-age=30`).
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: month
          in: query
          required: true
          description: Mese `YYYY-MM`.
          schema:
            type: string
            pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        - name: slots
          in: query
          required: false
          description: Fascia richiesta (default FULL).
          schema:
            $ref: "#/components/schemas/Slots"
        - name: zone_id
          in: query
          required: false
          description: Limita il calcolo a una zona.
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        "200":
          description: Calendario del mese
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCalendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/maps/{mapId}:
    get:
      operationId: getPublicMap
      tags: [public]
      summary: Geometria pubblica della mappa (senza dati sensibili)
      description: >-
        Mappa, postazioni attive delle zone visibili online (con `asset` del kit per l'illustrazione, ADR 0012)
        e decorazioni. Nessuno stato di occupazione: si combina con `availability`. Risposta con `ETag`
        (versione della mappa) e `Cache-Control: public, max-age=300`; `If-None-Match` risponde 304.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/MapID"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Mappa
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMapDocument"
        "304":
          description: Non modificata
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/availability:
    get:
      operationId: getPublicAvailability
      tags: [public]
      summary: Disponibilità per il canale online in un intervallo (passo "Dove")
      description: >-
        Spec 7.8, 12.3 passo 2. Zone `seat`: postazioni libere con categoria di prezzo e legenda dei prezzi per
        fila; zone `zone`: prezzo "da" e disponibilità indicativa (`indicator`); zone `quantity`: unità del pool.
        Applica la quota online (spec 7.6, ADR 0011) e ignora gli hold scaduti. Nessun dato personale.
      security: []
      parameters:
        - $ref: "#/components/parameters/Slug"
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Date"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Date"
        - name: slots
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Slots"
        - name: formula
          in: query
          required: false
          description: Formula scelta (default derivata dalle date).
          schema:
            $ref: "#/components/schemas/Formula"
        - name: zone_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
            x-go-type: string
      responses:
        "200":
          description: Disponibilità
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAvailability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /api/public/v1/{slug}/catalog:
    get:
      operationId: getPublicCatalog
      tags: [public]
      summary: Pack ed extra vendibili online compatibili con la selezione (passo "Cosa")
      description: >-
        Solo pack ed extra attivi con canale `online`. Con `zone_id` / `spot_id` restituisce solo i pack
        compatibili (zone ammesse, tipo di postazione) e le formule consentite per le date; `from_price` e
        `unit_price` sono indicativi (il prezzo vincolante è quello di `quote`).
      security: []
      parameters:
