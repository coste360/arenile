<!doctype html>
<html lang="it">
  <head>

    <title>Sito del lido (pagina ospite di prova)</title>
  </head>
  <body>
    <h1>Lido di prova</h1>
    <p>Pagina ospite usata dai test end-to-end del widget incorporabile.</p>

      window.__resizes = 0;
      document.addEventListener('arenile:resize', function () {

      });
