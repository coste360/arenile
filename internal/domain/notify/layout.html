<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#F2F4F7;-webkit-text-size-adjust:100%">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#F2F4F7">{{.Preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F2F4F7">
<tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#FFFFFF;border-radius:12px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<tr><td style="padding:20px 28px;background:{{.Brand.Primary}};color:{{.Brand.OnPrimary}}">
{{- if .Brand.LogoURL}}
<img src="{{.Brand.LogoURL}}" alt="{{.Brand.Name}}" height="40" style="display:block;height:40px;max-width:220px;border:0">
{{- else}}
<p style="margin:0;font-size:20px;line-height:1.3;font-weight:700;color:{{.Brand.OnPrimary}}">{{.Brand.Name}}</p>
{{- end}}
</td></tr>
<tr><td style="padding:28px">
{{.Body}}
</td></tr>
<tr><td style="padding:20px 28px;background:#F6F7F9;border-top:1px solid #E3E6EA">
<p style="margin:0 0 6px;font-size:14px;line-height:1.5;font-weight:700;color:#111111">{{.Brand.Name}}</p>
{{- range .Contacts}}
<p style="margin:0;font-size:13px;line-height:1.5;color:#5A6270">{{.}}</p>
{{- end}}
<p style="margin:14px 0 0;font-size:12px;line-height:1.5;color:#6B7280">{{.Footer}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:16px 0 0"><tr>
<td style="padding:0 8px 0 0;vertical-align:middle"><img src="cid:{{.MarkCID}}" width="20" height="20" alt="" style="display:block;width:20px;height:20px;border:0;border-radius:4px"></td>
<td style="vertical-align:middle;font-size:12px;line-height:20px;color:#6B7280"><a href="{{.ProductURL}}" style="color:#6B7280;text-decoration:none">{{.ProductLine}}</a></td>
</tr></table>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
