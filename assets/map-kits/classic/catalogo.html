body {margin:0;background:var(--background);color:var(--foreground)}

main{max-width:1448px;margin:auto;padding:28px 24px 60px}.meta{font-size:12px;color:var(--muted);padding-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.asset{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;position:relative;min-width:0;transition:border-color .15s}.asset:hover{border-color:var(--muted)}

.empty{padding:50px 0;text-align:center;color:var(--muted)}.count{font-size:12px;color:var(--muted)}

function draw(){let filtered=elements.filter(i=>(current==='Tutti'||i.category===current)&&(i.label.toLowerCase().includes(search)||i.id.includes(search)));document.getElementById('count').textContent=filtered.length+' elementi visualizzati · '+elements.length+' asset totali';document.getElementById('empty').hidden=!!filtered.length;document.getElementById('grid').innerHTML=filtered.map(i=>`<article class="asset"><div class="preview">${i.svg.replace('width="120" height="120"','width="'+scale+'" height="'+scale+'"')}</div><button title="Scarica SVG" onclick="save('${i.id}')">↓</button><div class="info"><h3>${i.label}</h3><small>${i.category} · ${i.type}</small></div></article>`).join('');document.getElementById('filters').innerHTML=cats.map(c=>`<button class="filter ${c===current?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(n=>n.onclick=()=>{current=n.dataset.cat;draw()})}
function save(id){const asset=elements.find(i=>i.id===id);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([asset.svg],{type:'image/svg+xml'}));a.download=id+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('search').oninput=e=>{search=e.target.value.toLowerCase();draw()};document.getElementById('theme').onclick=()=>{let dark=document.documentElement.classList.toggle('dark');document.getElementById('theme').textContent=dark?'☼ Tema chiaro':'◐ Tema scuro'};document.getElementById('scale').onclick=()=>{scale=scale===100?140:scale===140?80:100;document.getElementById('scale').textContent='Dimensione: '+scale+'%';document.querySelectorAll('.preview svg').forEach(e=>{e.style.width=scale+'px';e.style.height=scale+'px'})};draw();
</script></body></html>
